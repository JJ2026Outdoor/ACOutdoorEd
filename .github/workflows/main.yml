              "MH12CY009": {"credits": 1, "title": "Introduction to Expedition Skills",                         "mandatory": False},
              "MH32CY006": {"credits": 3, "title": "Camp Craft Skills",                                         "mandatory": False},
              "MH12CY006": {"credits": 4, "title": "Participate in an Expedition (4 credits)",                  "mandatory": False},
              "MH12CY007": {"credits": 6, "title": "Participate in an Expedition (6 credits)",                  "mandatory": False},
              "NL12CY004": {"credits": 3, "title": "Outdoor Activities for Tourism",                            "mandatory": False},
              "MH32CY007": {"credits": 3, "title": "Participate in a Land-based Activity",                      "mandatory": False},
              "MH32CY008": {"credits": 3, "title": "Participate in a Water-based Activity",                     "mandatory": False},
              "HB92CY009": {"credits": 3, "title": "Community Engagement in the Outdoors",                      "mandatory": False},
              "HB92CY010": {"credits": 3, "title": "Skills Development through Outdoor Learning",               "mandatory": False},
              "HB12CY080": {"credits": 2, "title": "The Health Benefits of Being Outdoors",                     "mandatory": False},
              "MH12CY010": {"credits": 3, "title": "Use a Map and Compass for a Route",                         "mandatory": False},
              "SE32CY006": {"credits": 2, "title": "Site Assessment and Soil Management",                       "mandatory": False},
              "SD72CY006": {"credits": 2, "title": "Propagation and Planting for Food Growing",                 "mandatory": False},
              "SE22CY030": {"credits": 2, "title": "Plant Care and Maintenance",                                "mandatory": False},
              "SC12CY002": {"credits": 2, "title": "Harvesting and Site Management",                            "mandatory": False},
              "QA12CY010": {"credits": 3, "title": "Flora and Fauna in the UK",                                 "mandatory": False},
              "RF42CY031": {"credits": 3, "title": "Physical Geography and Climate of the UK",                  "mandatory": False},
              "RF42CY032": {"credits": 2, "title": "Extractable Natural Resources",                             "mandatory": False},
              "RF42CY033": {"credits": 3, "title": "Land Use in England",                                       "mandatory": False},

              # ── OPTIONAL — Level 1 units (also count toward L2 qualification) ──
              "HB91CY005": {"credits": 1, "title": "Assisting in an Outdoor Learning Activity",                 "mandatory": False},
              "QA11CY010": {"credits": 3, "title": "Flora and Fauna of Wales (Level 1)",                        "mandatory": False},
              "RF41CY003": {"credits": 3, "title": "Physical Geography and Climate of Wales (Level 1)",         "mandatory": False},
              "AF41CY002": {"credits": 2, "title": "Team Working (Level 1)",                                    "mandatory": False},
              "GB71CY014": {"credits": 2, "title": "Practical Skills in the Outdoors (Level 1)",               "mandatory": False},
              "SG41CY009": {"credits": 3, "title": "Practical Woodland Skills",                                 "mandatory": False},
              "JA21CY023": {"credits": 3, "title": "Exploring Craft Resources and Techniques (Level 1)",       "mandatory": False},
              "JA21CY021": {"credits": 2, "title": "Creating Heritage and Traditional Craft (Level 1)",        "mandatory": False},
              "HB91CY007": {"credits": 3, "title": "Community Engagement in the Outdoors (Level 1)",           "mandatory": False},
              "RF41CY007": {"credits": 2, "title": "Extractable Natural Resources (Level 1)",                   "mandatory": False},
              "RF41CY006": {"credits": 3, "title": "Land Use in Wales (Level 1)",                               "mandatory": False},
              "NL11CY003": {"credits": 3, "title": "Outdoor Activities for Tourism (Level 1)",                  "mandatory": False},
              "HB91CY006": {"credits": 3, "title": "Skills Development through Outdoor Learning (Level 1)",    "mandatory": False},
              "QA11CY013": {"credits": 2, "title": "Observing Fauna and Flora (Level 1)",                       "mandatory": False},
              "SG21CY001": {"credits": 3, "title": "Woodland Tree Planting (Level 1)",                         "mandatory": False},
              "TG71CY009": {"credits": 8, "title": "Practical Traditional Timber Frame Construction (Level 1)", "mandatory": False},
              "SG41CY010": {"credits": 3, "title": "Sustainable Woodland Management (Level 1)",                 "mandatory": False},
              "HB11CY090": {"credits": 2, "title": "The Health Benefits of Being Outdoors (Level 1)",           "mandatory": False},
          }

          # ══════════════════════════════════════════════════════════════════════
          # LEVEL 3 — files3.json
          # ══════════════════════════════════════════════════════════════════════
          UNIT_META_L3 = {
              # ── MANDATORY ──────────────────────────────────────────────────────
              "HB93CY003": {"credits": 3, "title": "Risk Management when Learning in the Outdoors",         "mandatory": True},
              "HB93CY004": {"credits": 4, "title": "Skills Development through Outdoor Learning",           "mandatory": True},
              "HB93CY002": {"credits": 3, "title": "Sustainable Participation in Outdoor Activities",       "mandatory": True},

              # ── OPTIONAL — Level 3 ────────────────────────────────────────────
              "QA93CY003": {"credits": 3, "title": "Global Natural and Extractable Resources",              "mandatory": False},
              "MA63CY002": {"credits": 4, "title": "Leadership Skills",                                     "mandatory": False},
              "NK13CY017": {"credits": 3, "title": "Outdoor Activities for Tourism",                        "mandatory": False},
              "HB93CY007": {"credits": 2, "title": "Adventure Sector Careers",                              "mandatory": False},
              "HB93CY006": {"credits": 3, "title": "Bushcraft Skills",                                      "mandatory": False},
              "HB93CY008": {"credits": 2, "title": "Equipment for Adventures",                              "mandatory": False},
              "MH13CY001": {"credits": 6, "title": "Expedition Skills",                                     "mandatory": False},
              "QA93CY004": {"credits": 4, "title": "Sustainable Land Management",                           "mandatory": False},
              "HB93CY005": {"credits": 3, "title": "Team Working in the Outdoors",                          "mandatory": False},
              "HC43CY018": {"credits": 6, "title": "Work Experience",                                       "mandatory": False},
              "SG43CY004": {"credits": 9, "title": "Sustainable Woodland Management",                       "mandatory": False},
              "MH33CY004": {"credits": 4, "title": "Advanced Campcraft Skills",                             "mandatory": False},
              "HB93CY012": {"credits": 3, "title": "Adventure Sports Coaching",                             "mandatory": False},
              "QA33CY010": {"credits": 3, "title": "Climate Change and Outdoor Learning",                   "mandatory": False},
              "HB93CY013": {"credits": 2, "title": "Elite Performance in Outdoor and Adventure Sports",     "mandatory": False},
              "MH33CY005": {"credits": 4, "title": "Land-based Activities for Learning in the Outdoors",   "mandatory": False},
              "MH33CY006": {"credits": 4, "title": "Water-based Activities for Learning in the Outdoors",  "mandatory": False},
              "HB93CY014": {"credits": 4, "title": "Outdoor Activity Taster Sessions",                      "mandatory": False},
              "KA13CY008": {"credits": 2, "title": "Media in the Outdoors",                                 "mandatory": False},
              "PV23CY006": {"credits": 3, "title": "First Aid in the Outdoors",                             "mandatory": False},
              "MH13CY003": {"credits": 3, "title": "Using a Map and Compass",                               "mandatory": False},
              "MA73CY002": {"credits": 3, "title": "Inclusive Outdoor Practice",                            "mandatory": False},
          }

          # ══════════════════════════════════════════════════════════════════════
          # PSE SUITE — pse.json  (Agored Cymru Level 2 PSE, Certificate 127711 /
          # Extended Certificate 127712). Fixed 14-unit teaching sequence — every
          # unit is listed regardless of whether files exist yet (mirrors the
          # "mandatory" behaviour above, since there are no optional units here).
          #
          # INTERLEAVED ORDER (adopted 2026-09-19, superseding the earlier
          # all-Level-1-then-all-Level-2 block order): each Level 1 unit is
          # immediately followed by the Level 2 unit that extends it, so students
          # meet the foundation and its extension back-to-back instead of up to
          # 8 units apart. Decision-Making has two extensions (Personal Money
          # Management, Problem-Solving Skills) taught consecutively after it;
          # Healthy Lifestyles has no Level 2 extension and simply keeps its slot.
          #
          # Certificate 127711 needs 13 credits (Level 1 capped at 6 + Level 2
          # uncapped). In this order that threshold is crossed one unit later
          # than Anti-bullying Awareness — Anti-bullying alone only banks 12 of
          # 13 — so the "checkpoint": "certificate" flag now sits on Healthy
          # Lifestyles (sequence 10), not Anti-bullying Awareness. Extended
          # Certificate 127712 needs all 18 credits, so it still lands on the
          # final unit (Crime Prevention and Keeping Safe) as before.
          #
          # The Scheme of Work for this order is documented in pse-scheme-of-work.html
          # and in the project's PSE-Scheme-of-Work.md — keep both in sync with
          # this dict if the sequence ever changes again.
          # ══════════════════════════════════════════════════════════════════════
          UNIT_META_PSE = {
              "HB31CY011": {"sequence": 1,  "level": 1, "credits": 1, "glh": 9,  "cumGLH": 9,   "title": "Anger Management",                          "checkpoint": None},
              "HB32CY014": {"sequence": 2,  "level": 2, "credits": 1, "glh": 9,  "cumGLH": 18,  "title": "Understanding Stress",                       "checkpoint": None},
              "HB61CY011": {"sequence": 3,  "level": 1, "credits": 1, "glh": 9,  "cumGLH": 27,  "title": "Assertiveness Skills",                       "checkpoint": None},
              "HB12CY079": {"sequence": 4,  "level": 2, "credits": 2, "glh": 10, "cumGLH": 37,  "title": "Emotional Intelligence",                     "checkpoint": None},
              "AF21CY003": {"sequence": 5,  "level": 1, "credits": 1, "glh": 9,  "cumGLH": 46,  "title": "Decision-Making",                            "checkpoint": None},
              "HE12CY001": {"sequence": 6,  "level": 2, "credits": 2, "glh": 19, "cumGLH": 65,  "title": "Personal Money Management",                   "checkpoint": None},
              "AF72CY003": {"sequence": 7,  "level": 2, "credits": 1, "glh": 9,  "cumGLH": 74,  "title": "Problem-Solving Skills",                      "checkpoint": None},
              "HB71CY018": {"sequence": 8,  "level": 1, "credits": 1, "glh": 9,  "cumGLH": 83,  "title": "Negotiation Skills",                         "checkpoint": None},
              "HB12CY057": {"sequence": 9,  "level": 2, "credits": 2, "glh": 18, "cumGLH": 101, "title": "Anti-bullying Awareness",                     "checkpoint": None},
              "PA91CY015": {"sequence": 10, "level": 1, "credits": 1, "glh": 9,  "cumGLH": 110, "title": "Healthy Lifestyles",                         "checkpoint": "certificate"},
              "QJ21CY002": {"sequence": 11, "level": 1, "credits": 1, "glh": 9,  "cumGLH": 119, "title": "Fire Safety in the Home",                    "checkpoint": None},
              "HD22CY028": {"sequence": 12, "level": 2, "credits": 2, "glh": 5,  "cumGLH": 124, "title": "Staying Safe Online",                         "checkpoint": None},
              "HB11CY075": {"sequence": 13, "level": 1, "credits": 1, "glh": 10, "cumGLH": 134, "title": "Social and Legal Aspects of Personal Safety", "checkpoint": None},
              "QH52CY004": {"sequence": 14, "level": 2, "credits": 1, "glh": 9,  "cumGLH": 143, "title": "Crime Prevention and Keeping Safe",           "checkpoint": "extended_certificate"},
          }

          # ══════════════════════════════════════════════════════════════════════
          # WRE SUITE — wre.json  (Agored Cymru Level Two Work Related Education:
          # Award / Extended Award / Certificate / Extended Certificate).
          # Fixed 7-unit teaching sequence from WRE-Scheme-of-Work.md — every unit
          # is listed whether or not files exist yet. Filenames only need to
          # CONTAIN the unit code anywhere (e.g. CareerExploration_HC12CY014_Digital.html
          # or HC12CY014CareerExplorationDigital.html both work).
          # "level" is the unit's own level (2 = Level Two, 1 = Level One).
          # Keep in sync with wre-scheme-of-work.html if the order ever changes —
          # moving a unit moves the award checkpoints.
          # ══════════════════════════════════════════════════════════════════════
          UNIT_META_WRE = {
              "HC12CY014": {"sequence": 1, "level": 2, "credits": 2, "glh": 16, "cumGLH": 16,  "title": "Career Exploration",                                "checkpoint": None},
              "HB12CY060": {"sequence": 2, "level": 2, "credits": 3, "glh": 24, "cumGLH": 40,  "title": "Developing Personal Confidence and Self Awareness", "checkpoint": "award"},
              "HC61CY015": {"sequence": 3, "level": 1, "credits": 3, "glh": 28, "cumGLH": 68,  "title": "Creating a Tailored Curriculum Vitae",              "checkpoint": "extended_award"},
              "HC62CY008": {"sequence": 4, "level": 2, "credits": 2, "glh": 16, "cumGLH": 84,  "title": "Applying for a Job",                                "checkpoint": None},
              "HC61CY012": {"sequence": 5, "level": 1, "credits": 3, "glh": 30, "cumGLH": 114, "title": "Interview Skills",                                  "checkpoint": "certificate"},
              "HC42CY004": {"sequence": 6, "level": 2, "credits": 3, "glh": 30, "cumGLH": 144, "title": "Work Experience",                                   "checkpoint": None},
              "HC12CY015": {"sequence": 7, "level": 2, "credits": 3, "glh": 24, "cumGLH": 168, "title": "Building a Personal Career Portfolio",              "checkpoint": "extended_certificate"},
          }

          build_manifest(UNIT_META_L2, "files.json",  IGNORE)
          build_manifest(UNIT_META_L3, "files3.json", IGNORE)
          build_manifest_pse(UNIT_META_PSE, "pse.json", IGNORE)
          build_manifest_pse(UNIT_META_WRE, "wre.json", IGNORE)

          # ══════════════════════════════════════════════════════════════════════
          # BTEC — btec.json
          # All 7 units are always shown (equivalent to mandatory=True).
          # The metadata (title, subtitle, brief, aims, group) is preserved from
          # the existing btec.json; only the files[] array is regenerated by
          # scanning for files prefixed with the unit ID.
          # To add a resource: upload a file prefixed with the unit ID,
          # e.g. PS5FindingOutDigital.html — no other changes needed.
          # ══════════════════════════════════════════════════════════════════════

          # Load the existing btec.json to preserve metadata fields
          btec_path = Path("btec.json")
          if btec_path.exists():
              with open(btec_path, "r", encoding="utf-8") as fh:
                  existing = json.load(fh)
              meta_by_id = {u["id"]: u for u in existing.get("units", [])}
          else:
              meta_by_id = {}

          # Unit order and IDs we care about
          BTEC_UNITS = ["A1", "A2", "PS5", "PS6", "PS9", "PS11", "PS12"]

          root = Path(".")
          discovered_btec = {uid: [] for uid in BTEC_UNITS}

          for f in sorted(root.iterdir()):
              if not f.is_file():
                  continue
              if f.name.startswith(".") or f.name in IGNORE:
                  continue
              for uid in BTEC_UNITS:
                  if f.name.upper().startswith(uid.upper()):
                      ext = f.suffix.lower().lstrip(".")
                      ftype = ext.upper() if ext else "FILE"
                      stem = Path(f.name).stem
                      label = stem[len(uid):].lstrip("_- ").replace("_", " ").replace("-", " ").strip()
                      if not label:
                          label = EXT_NAMES.get(f.suffix.lower(), stem.replace("_", " "))
                      discovered_btec[uid].append({
                          "name":     label,
                          "filename": f.name,
                          "type":     ftype,
                      })
                      break

          units_out = []
          for uid in BTEC_UNITS:
              meta = meta_by_id.get(uid, {})
              units_out.append({
                  "id":       uid,
                  "glh":      meta.get("glh", 0),
                  "group":    meta.get("group", "sector"),
                  "groupLabel": meta.get("groupLabel", ""),
                  "title":    meta.get("title", uid),
                  "subtitle": meta.get("subtitle", ""),
                  "brief":    meta.get("brief", ""),
                  "aims":     meta.get("aims", ""),
                  "files":    discovered_btec[uid],
              })

          with open("btec.json", "w", encoding="utf-8") as fh:
              json.dump({"units": units_out}, fh, indent=2, ensure_ascii=False)
          print(f"btec.json updated — {len(units_out)} units written.")

          PYEOF

      - name: Commit updated manifests
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add files.json files3.json pse.json wre.json btec.json
          git diff --cached --quiet || git commit -m "chore: auto-update resource manifests [skip ci]"
          git push
