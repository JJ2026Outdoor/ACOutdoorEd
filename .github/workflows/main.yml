name: Update Resource Manifest

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'

      - name: Scan repo and update files.json, files3.json, pse.json, wre.json and btec.json
        run: |
          python3 << 'PYEOF'
          import json
          import re
          from pathlib import Path

          # ── Shared helpers ─────────────────────────────────────────────────────

          EXT_NAMES = {
              ".html": "Digital Workbook",
              ".pptx": "Teaching Slides",
              ".ppt":  "Teaching Slides",
              ".pdf":  "PDF Document",
              ".docx": "Word Document",
              ".doc":  "Word Document",
              ".xlsx": "Spreadsheet",
              ".xls":  "Spreadsheet",
              ".csv":  "Data File",
              ".mp3":  "Audio",
              ".mp4":  "Video",
          }

          def friendly_name(filename, uid):
              stem = Path(filename).stem
              label = stem[len(uid):].lstrip("_- ").replace("_", " ").replace("-", " ").strip()
              if label:
                  return label
              ext = Path(filename).suffix.lower()
              return EXT_NAMES.get(ext, stem.replace("_", " "))

          def file_type(filename):
              ext = Path(filename).suffix.lower().lstrip(".")
              return ext.upper() if ext else "FILE"

          def build_manifest(unit_meta, output_file, ignore_files):
              root = Path(".")
              discovered = {uid: [] for uid in unit_meta}

              for f in sorted(root.iterdir()):
                  if not f.is_file():
                      continue
                  if f.name.startswith(".") or f.name in ignore_files:
                      continue
                  for uid in unit_meta:
                      if f.name.upper().startswith(uid.upper()):
                          discovered[uid].append({
                              "name":     friendly_name(f.name, uid),
                              "filename": f.name,
                              "type":     file_type(f.name),
                          })
                          break

              units_out = []
              for uid, meta in unit_meta.items():
                  files = discovered.get(uid, [])
                  if not meta["mandatory"] and not files:
                      continue
                  units_out.append({
                      "id":        uid,
                      "credits":   meta["credits"],
                      "title":     meta["title"],
                      "mandatory": meta["mandatory"],
                      "files":     files,
                  })

              with open(output_file, "w", encoding="utf-8") as fh:
                  json.dump({"units": units_out}, fh, indent=2, ensure_ascii=False)
              print(f"{output_file} updated — {len(units_out)} units written.")

          # ── Mid-code helpers (PSE + WRE) ────────────────────────────────────────
          # PSE resource files use a DIFFERENT naming convention to the rest of the
          # repo: the unit code sits in the MIDDLE of the filename, not as a prefix,
          # e.g. "AngerManagement_HB31CY011_Digital.html" (Title_UNITCODE_Type.ext).
          # This matches the naming already used when the PSE workbooks were built —
          # do not rename existing/incoming PSE files to the prefix convention used
          # by the Outdoor Ed / BTEC sections; the matcher below is built for this
          # pattern instead (substring match, not startswith).

          def camel_space(s):
              return re.sub(r'(?<=[a-z])(?=[A-Z])', ' ', s)

          TYPE_LABELS = {
              "digital": "Digital Workbook", "workbook": "Printable Workbook",
              "teaching": "Teaching Slides", "slides": "Teaching Slides",
              "accessible": "Accessible Workbook", "answerkey": "Answer Key",
          }

          def tidy_label(label):
              # "Digital" -> "Digital Workbook"; "Handout Match The Emotion" -> "Handout: Match The Emotion";
              # "Career Exploration Digital" (code-prefix naming) -> "Digital Workbook"
              words = label.split()
              if not words:
                  return label
              if words[0].lower() == "handout" and len(words) > 1:
                  return "Handout: " + " ".join(words[1:])
              whole = "".join(words).lower()
              if whole in TYPE_LABELS:
                  return TYPE_LABELS[whole]
              last = words[-1].lower()
              if last in TYPE_LABELS:
                  return TYPE_LABELS[last]
              return label

          def friendly_name_pse(filename, uid):
              return tidy_label(_friendly_name_pse(filename, uid))

          def _friendly_name_pse(filename, uid):
              stem = Path(filename).stem
              idx = stem.upper().find(uid.upper())
              if idx == -1:
                  ext = Path(filename).suffix.lower()
                  return EXT_NAMES.get(ext, stem.replace("_", " "))
              after = stem[idx + len(uid):].lstrip("_- ").replace("_", " ").replace("-", " ").strip()
              if after:
                  return camel_space(after)
              before = stem[:idx].rstrip("_- ").replace("_", " ").replace("-", " ").strip()
              if before:
                  return camel_space(before)
              ext = Path(filename).suffix.lower()
              return EXT_NAMES.get(ext, stem.replace("_", " "))

          def build_manifest_pse(unit_meta, output_file, ignore_files):
              root = Path(".")
              discovered = {uid: [] for uid in unit_meta}

              for f in sorted(root.iterdir()):
                  if not f.is_file():
                      continue
                  if f.name.startswith(".") or f.name in ignore_files:
                      continue
                  for uid in unit_meta:
                      if uid.upper() in f.name.upper():
                          discovered[uid].append({
                              "name":     friendly_name_pse(f.name, uid),
                              "filename": f.name,
                              "type":     file_type(f.name),
                          })
                          break

              units_out = []
              for uid, meta in unit_meta.items():
                  units_out.append({
                      "id":          uid,
                      "sequence":    meta["sequence"],
                      "level":       meta["level"],
                      "credits":     meta["credits"],
                      "glh":         meta["glh"],
                      "cumGLH":      meta["cumGLH"],
                      "title":       meta["title"],
                      "checkpoint":  meta.get("checkpoint"),
                      "levelLabel":  meta.get("levelLabel"),
                      "files":       discovered.get(uid, []),
                  })

              with open(output_file, "w", encoding="utf-8") as fh:
                  json.dump({"units": units_out}, fh, indent=2, ensure_ascii=False)
              print(f"{output_file} updated — {len(units_out)} units written.")

          # ── IGNORE list (files never treated as unit resources) ────────────────
          IGNORE = {
              "index.html", "agored.html", "agored3.html", "agored_level.html",
              "btec.html", "locations.html",
              "pse.html", "pse-scheme-of-work.html",
              "wre.html", "wre-scheme-of-work.html",
              "files.json", "files3.json", "btec.json", "pse.json", "wre.json",
              "WRE-Scheme-of-Work.md", "PSE-Scheme-of-Work.md",
              ".gitignore", "README.md", "LICENSE", ".nojekyll",
              "update-manifest.yml", "updatemanifest.yml",
          }

