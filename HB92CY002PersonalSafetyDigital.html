<script>
const {
  useState,

  useCallback,

  LG = "#E8F5EE",

const RED = "#DC2626",

// To change: find this line and replace Agored2025 with your chosen password
const ASSESSOR_PASS = "Agored2025";
const ASSESSOR_LT = "#EFF6FF";
const ASSESSOR_BD = "#BFDBFE";
const SUBMIT_EMAIL = "";  // teacher: fill in the hand-in email address here
const nz = v => typeof v === "string" && v.trim().length > 0;
const rowComplete = (row, keys) => row && keys.every(k => nz(row[k]));
const objMin = (arr, n, keys) => Array.isArray(arr) && arr.filter(r => rowComplete(r, keys)).length >= n;
const AC_FIELDS = {
  "1.1": d => nz(d.ac11_hazard) && nz(d.ac11_risk),
  "1.2": d => objMin(d.ac12_rows, 3, ["hazard", "risk", "who"]),
  "1.3": d => objMin(d.ac13_rows, 3, ["hazardRisk", "control", "effectiveness"]),
  "1.4": d => nz(d.ac14_activity) && nz(d.ac14_decision) && nz(d.ac14_different),
  "2.1": d => nz(d.ac21_reason1) && nz(d.ac21_reason2) && nz(d.ac21_consequence),
  "2.2": d => objMin(d.ac22_signs, 4, ["name", "meaning"]),

  "3.1": d => nz(d.ac31_immediate) && nz(d.ac31_help) && nz(d.ac31_after2) && nz(d.ac31_nearmiss),
  "4.1": d => nz(d.ac41_activity) && objMin(d.ac41_rows, 2, ["item", "why", "how"]),
  "4.2": d => nz(d.ac42_equipment) && nz(d.ac42_instructions) && nz(d.ac42_why)
