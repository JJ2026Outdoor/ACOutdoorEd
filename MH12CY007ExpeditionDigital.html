<title>MH12CY007 — Participate in an Expedition (3-Day)</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;font-size:15px;color:#1A1A1A;background:#F5F5F3}
textarea{font-family:Arial,sans-serif;font-size:14px;resize:vertical;width:100%;border:1px solid #D4D4CC;border-radius:4px;padding:8px;background:#fff}
textarea:focus{outline:2px solid #1A6B3C;border-color:#1A6B3C}
input[type=text],input[type=date],input[type=password]{font-family:Arial,sans-serif;font-size:14px;border:1px solid #D4D4CC;border-radius:4px;padding:6px 10px;width:100%}
input:focus{outline:2px solid #1A6B3C;border-color:#1A6B3C}
button{cursor:pointer;font-family:Arial,sans-serif}
.ta-print{display:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.6}}
@media print{
  #sticky-header{position:static!important}
  #nav-sidebar{display:none!important}
  .no-print{display:none!important}
  .print-section{display:block!important}
  #ev-cover-strip{display:block!important}
  .ta-screen{display:none!important}
  .ta-print{display:block!important;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;line-height:1.5;min-height:16px}
}
</style>
