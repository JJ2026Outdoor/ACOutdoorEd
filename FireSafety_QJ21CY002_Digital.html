<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fire Safety in the Home Workbook - QJ21CY002</title>
<style>:root { --pri:#3E7A8C; --dark:#1F4A56; --light:#E8F1F3; --ink:#2a2a2a; --line:#D4D4CC; --red:#DC2626; --amber:#F59E0B; --asr:#1e3a8a; --asr-lt:#EFF6FF; --asr-bd:#BFDBFE; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin:0; font-family: Arial, Helvetica, sans-serif; color: var(--ink); background:#F7F7F5; font-size:16px; line-height:1.5; }
.app { min-height:100vh; }
h1,h2,h3 { color: var(--pri); }
.print-only, .ta-print { display:none; }

/* header */
.topbar { background: var(--pri); color:#fff; padding:10px 16px; display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
.topbar.assessor { background: var(--asr); }
.brand { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.brand-school { height:34px; border-radius:6px; }
.brand-agored { height:24px; background:#fff; border-radius:4px; padding:2px 6px; }
.actions { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.saved { font-size:12px; opacity:.9; margin-right:4px; min-width:52px; }
.btn-top { background:transparent; color:#fff; border:1px solid rgba(255,255,255,.7); border-radius:4px; padding:5px 10px; cursor:pointer; font-size:13px; }
.btn-top:hover { background: rgba(255,255,255,.15); }
.btn-top.solid { background:#fff; color: var(--asr); font-weight:700; }
.nav { background: var(--dark); display:flex; flex-wrap:wrap; gap:2px; padding:6px 10px; }
.nav button { background:transparent; color:#fff; border:none; border-radius:4px; padding:6px 10px; cursor:pointer; font-size:13px; }
.nav button.on { background:#fff; color: var(--dark); font-weight:700; }
.banner { padding:8px 16px; font-size:14px; }
.assessor-banner { background: var(--asr-lt); color: var(--asr); border-bottom:2px solid var(--asr-bd); }
.banner-red { background:#FEF2F2; color:#991b1b; border-bottom:2px solid #fecaca; }
.banner-amber { background:#FFFBEB; color:#92400e; border-bottom:2px solid #fde68a; }
.banner-green { background:#F0FDF4; color:#166534; border-bottom:2px solid #bbf7d0; }

/* pages + cards */
main { padding:8px 16px 60px; }
.page { max-width:820px; margin:20px auto; }
.page.narrow { max-width:700px; }
.card { background:#fff; border:1px solid #ddd; border-radius:6px; padding:14px; margin-bottom:14px; }
.card-head { display:flex; justify-content:space-between; margin-bottom:8px; }
.card-head strong { color: var(--pri); }
.status { font-size:12px; color:#999; }
.status.done { color: var(--dark); }
.prompt { margin-top:0; }
textarea, input[type=text], input:not([type]), input[type=date], input[type=password], select { font-family:inherit; font-size:15px; border:1px solid #ccc; border-radius:4px; padding:8px; }
textarea { width:100%; display:block; }
textarea:disabled, input:disabled { background:#f3f3f0; color:#333; }
.part { margin-bottom:8px; }
.part-label { font-size:13px; font-weight:700; color: var(--dark); text-transform:capitalize; display:block; }
.list-row { display:flex; gap:8px; align-items:center; margin-bottom:6px; }
.list-row input { flex:1; }
.list-num { width:24px; color: var(--pri); font-weight:700; }
.list-count { font-size:12px; color:#a00; margin-top:4px; }
.list-count.ok { color: var(--dark); }

/* buttons */
.btn { font-family:inherit; font-size:13px; border-radius:6px; padding:6px 12px; cursor:pointer; border:1.5px solid var(--pri); background: var(--light); color: var(--dark); font-weight:600; margin-top:6px; }
.btn-primary { background: var(--pri); color:#fff; }
.btn-soft { background: var(--light); }
.btn-rec { }
.btn-rec-stop { border-color: var(--red); background:#FEF2F2; color:#b91c1c; animation: pulse 1.4s infinite; }
.btn-x { background:none; border:none; color:#b00; cursor:pointer; font-size:18px; }
.btn-x-text { background:none; border:none; color:#b00; cursor:pointer; font-size:12px; margin-top:6px; text-decoration:underline; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.6} }
.rec-note, .rec-name { font-size:12px; color:#666; }
.voice { margin-top:8px; }
.rec-item { display:flex; align-items:center; gap:8px; margin-top:6px; flex-wrap:wrap; }
.rec-item audio { height:32px; max-width:100%; }

/* assessor bits */
.mark-picker { display:flex; align-items:center; gap:6px; margin-top:12px; padding:8px 10px; background: var(--asr-lt); border:1px solid var(--asr-bd); border-radius:6px; }
.mark-label { font-size:12px; font-weight:700; color: var(--asr); }
.btn-mark { border:1.5px solid #9ca3af; background:#fff; border-radius:6px; padding:4px 12px; cursor:pointer; font-size:13px; font-weight:600; }
.btn-mark.met.on { background:#16a34a; border-color:#16a34a; color:#fff; }
.btn-mark.notyet.on { background:#dc2626; border-color:#dc2626; color:#fff; }
.mark-badge { display:inline-block; margin-top:10px; font-size:12px; font-weight:700; padding:3px 10px; border-radius:12px; }
.mark-badge.met { background:#dcfce7; color:#166534; }
.mark-badge.notyet { background:#fee2e2; color:#991b1b; }
.feedback { margin-top:18px; background: var(--asr-lt); border:2px solid var(--asr); border-radius:10px; padding:14px 16px; }
.fb-label { font-size:12px; font-weight:700; color: var(--asr); margin-bottom:8px; }
.fb-text { white-space:pre-wrap; }
.overall { display:flex; gap:18px; margin-bottom:10px; }

/* evidence */
.ev-item img { max-width:100%; max-height:280px; border-radius:6px; display:block; margin-bottom:8px; }
.chips { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:8px; }
.chip-label { font-size:12px; color:#666; }
.chip { border:1px solid var(--line); background:#fff; border-radius:14px; padding:3px 10px; font-size:12px; cursor:pointer; }
.chip.on { background: var(--pri); color:#fff; border-color: var(--pri); }
.ev-add { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:8px 0 14px; }
.warn-text { color:#b91c1c; font-size:13px; margin-top:6px; }

/* front matter */
.cover { text-align:center; padding:50px 10px; }
.cover-logos { display:flex; justify-content:center; align-items:center; gap:24px; margin-bottom:20px; flex-wrap:wrap; }
.logo-school { height:90px; border-radius:10px; }
.logo-agored { height:64px; }
.cover h1 { margin-bottom:4px; }
.cover-q { color: var(--dark); font-size:16px; }
.cover-u { color:#555; }
.cover-name { margin-top:30px; }
.cover-name label { display:block; margin-bottom:6px; }
.cover-name input { width:300px; max-width:100%; text-align:center; padding:8px; }
.gl { margin-bottom:10px; }
.gl strong { color: var(--dark); }
.cy { color:#555; font-style:italic; }
.check { display:flex; gap:8px; align-items:flex-start; margin:12px 0; cursor:pointer; }
.decl-row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:12px; }
.tbl { width:100%; border-collapse:collapse; }
.tbl td { white-space: pre-line; }
.tbl th, .tbl td { border:1px solid var(--line); padding:8px 10px; text-align:left; }
.tbl th { background: var(--light); color: var(--dark); }
.notice { background:#fff8e6; border:1px solid #e0c060; border-radius:6px; padding:12px; margin:14px 0; }
.dcf { background:#fff; border:1.5px solid #c7d2fe; border-radius:8px; padding:10px 14px; margin-bottom:14px; }
.dcf-badge { display:inline-flex; align-items:center; gap:6px; background:#eef2ff; border:1px solid #c7d2fe; border-radius:20px; padding:3px 10px 3px 3px; font-size:11px; font-weight:600; color:#3730a3; margin:0 8px 4px 0; }
.dcf-badge img { width:18px; height:18px; border-radius:4px; object-fit:cover; }
.dcf-note { font-size:12px; color:#6B6B6B; }

/* modals */
.modal-bg { position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; z-index:50; padding:16px; }
.modal { background:#fff; border-radius:10px; padding:22px; width:100%; max-width:420px; }
.modal h3 { margin-top:0; }
.modal input[type=password] { width:100%; }
.modal-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:14px; }
.opt { display:flex; gap:10px; align-items:flex-start; border:1.5px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:8px; cursor:pointer; }
.opt.on { border-color: var(--pri); background: var(--light); }
.print-banner { background:#fff8e6; padding:10px 16px; border-bottom:1px solid #e0c060; }

/* EV summary */
.ev-strip { border-bottom:2px solid var(--pri); padding-bottom:10px; margin-bottom:14px; }
.ev-lo { margin-bottom:18px; }
.ev-ac { border:1px solid var(--line); border-radius:6px; padding:10px 12px; margin-bottom:8px; background:#fff; }
.ev-ans { white-space:pre-wrap; margin:6px 0; }
.ev-note, .ev-mark, .ev-fb { font-size:14px; margin-top:4px; }
.ev-thumb { max-width:220px; max-height:160px; display:block; margin-bottom:6px; }

.choices { display:flex; flex-wrap:wrap; gap:8px; margin:6px 0; }
.choice { font-family:inherit; font-size:16px; padding:10px 18px; border:2px solid var(--line); background:#fff; border-radius:24px; cursor:pointer; }
.choice.on { border-color: var(--pri); background: var(--pri); color:#fff; font-weight:700; }
.choice:disabled { cursor:default; }
.big .btn-rec, .big .btn-rec-stop { font-size:17px; padding:12px 22px; border-radius:26px; }
.big .btn, .big .btn-mark { font-size:16px; }

/* ── block content (Knowledge Hubs, tables, info boxes, activities) ───── */
.blk-p { margin:0 0 10px; }
.blk-h { margin:14px 0 6px; color: var(--dark); font-size:15px; }
.blk-list { margin:6px 0 10px 20px; padding:0; }
.blk-list li { margin-bottom:5px; }
.prompt-hint { background:#FFFBEB; border-left:4px solid var(--amber); padding:8px 12px; margin:14px 0 8px; font-weight:700; border-radius:0 6px 6px 0; }
.field { margin-bottom:12px; }
.inp { margin-bottom:10px; }
.inp label { display:block; font-size:13px; font-weight:700; color: var(--dark); margin-bottom:3px; }
.inp input { width:100%; }
.khub { border:1px solid var(--line); border-radius:8px; overflow:hidden; margin-bottom:16px; background:#fff; }
.khub-head { background: var(--pri); color:#fff; padding:9px 14px; font-weight:700; }
.khub-body { padding:14px; }
.info { border:1px solid var(--pri); border-left-width:5px; background: var(--light); border-radius:6px; padding:10px 14px; margin:12px 0; }
.info-green { border-color:#16a34a; background:#F0FDF4; }
.info-amber { border-color: var(--amber); background:#FFFBEB; }
.info-title { font-weight:800; font-size:12px; letter-spacing:.04em; text-transform:uppercase; margin-bottom:6px; color: var(--dark); }
.info .blk-p:last-child { margin-bottom:0; }
.card-bar { background: var(--pri); color:#fff; padding:9px 14px; border-radius:8px 8px 0 0; font-weight:700; }
.card-bar.solo { border-radius:8px; margin:14px 0 8px; }
.card-attached { border-top:none; border-radius:0 0 8px 8px; margin-top:0; }
.tbl-wrap { overflow-x:auto; margin:8px 0 12px; }
.tbl-input input { width:100%; min-width:110px; }
.model { margin:6px 0 12px; }
.model-body { background:#F0FDF4; border:1px solid #bbf7d0; border-radius:6px; padding:10px 12px; margin-top:6px; }
.links { border:1px dashed var(--line); border-radius:8px; padding:10px 14px; margin:12px 0; background:#fff; }
.links-title { font-weight:700; color: var(--dark); margin-bottom:4px; }
.links ul { margin:4px 0 0 18px; padding:0; }
.src-card { border:1px solid var(--line); border-radius:8px; overflow:hidden; margin-bottom:16px; background:#fff; }
.src-head { background: var(--dark); color:#fff; padding:10px 14px; font-weight:700; }
.src-meta { font-weight:400; font-size:12px; opacity:.9; }
.src-body { padding:12px 14px; }
.crit-marks { margin:12px 0; padding:10px 12px; border:1px solid var(--asr-bd); border-radius:8px; background: var(--asr-lt); }
.crit-marks-title { font-size:12px; font-weight:700; color: var(--asr); margin-bottom:6px; }
.crit-row { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; padding:4px 0; }
.crit-row .mark-picker { margin:0; padding:2px 6px; background:transparent; border:none; }
.suggest { margin:6px 0 10px; font-size:14px; }
.tier-progress { display:flex; gap:14px; flex-wrap:wrap; font-size:14px; }
.small { font-size:13px; color:#666; margin-top:0; }
.contents-list .indent { margin-left:22px; }
.cover-kicker { font-size:13px; letter-spacing:.06em; font-weight:700; color: var(--dark); }
.cover-fields { max-width:340px; margin:26px auto 0; text-align:left; }
.cover-fields .cover-name { margin-top:14px; }
.cover-fields .cover-name input { width:100%; text-align:left; }
.ev-q { font-size:14px; color:#555; }
.ev-crit td { padding:4px 10px; font-size:14px; }
.speak { background:none; border:1px solid var(--line); border-radius:50%; width:28px; height:28px; cursor:pointer; font-size:14px; line-height:1; vertical-align:middle; margin-left:4px; padding:0; }
.speak:hover { background: var(--light); }
.step-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; font-size:14px; color:#555; }
.step-dots { display:flex; gap:4px; flex-wrap:wrap; }
.dot { width:10px; height:10px; border-radius:50%; background:#d1d5db; }
.dot.past { background: var(--pri); opacity:.5; }
.dot.on { background: var(--pri); transform:scale(1.25); }
.step-nav { display:flex; justify-content:space-between; margin:16px 0; }
.step-nav .btn { font-size:16px; padding:10px 22px; }
.engine-foot { text-align:center; font-size:11px; color:#999; padding:18px 10px 30px; }
.blk-hr { border:none; border-top:2px dashed var(--line); margin:18px 0; }
.kb { border:1px solid var(--line); background:#fff; border-left:5px solid var(--pri); border-radius:6px; padding:10px 14px; margin:12px 0; }
.kb-title { font-weight:800; color: var(--dark); margin-bottom:6px; }
.kb-item { padding:3px 0; }
.lohead { background: var(--pri); color:#fff; border-radius:8px; padding:12px 16px; margin:14px 0; }
.lohead-badge { font-size:12px; letter-spacing:.06em; text-transform:uppercase; opacity:.85; }
.lohead-title { font-size:19px; font-weight:800; }
.continue { margin:18px 0 6px; text-align:right; }
.unit-details, .cover-status { max-width:560px; margin:22px auto 0; text-align:left; border:1px solid var(--line); background:#fff; border-radius:8px; padding:12px 16px; }
.unit-details-title, .cs-title { font-weight:800; color: var(--dark); margin-bottom:8px; }
.unit-grid, .cs-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; }
.ud-k { font-size:12px; color:#666; text-transform:uppercase; letter-spacing:.04em; }
.ud-v { font-weight:700; }
.cover-status.assessor { border-color: var(--asr-bd); background: var(--asr-lt); }
.cs-links { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
.progress-row { display:flex; align-items:center; gap:12px; }
.progress-pct { font-size:26px; font-weight:800; color: var(--pri); min-width:64px; }
.progress-track { flex:1; height:12px; background:#e5e7eb; border-radius:6px; overflow:hidden; }
.progress-fill { height:100%; background: var(--pri); }
.contents-list { padding-left:0; list-style:none; }
.contents-link { display:block; width:100%; text-align:left; background:#fff; border:1px solid var(--line); border-radius:8px; padding:10px 14px; margin-bottom:8px; cursor:pointer; font-family:inherit; font-size:15px; }
.contents-link:hover { border-color: var(--pri); background: var(--light); }
.c-title { display:block; font-weight:700; color: var(--dark); }
.c-desc { display:block; font-size:13px; color:#666; }
.decl-summary { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:10px; margin:10px 0; padding:10px 12px; background: var(--light); border-radius:8px; }
.send-to .send-email { font-weight:800; font-size:17px; }
.ac-hint { color:#666; font-style:italic; margin:-4px 0 8px; }
.voice-label { font-size:13px; color:#666; margin-top:6px; }
.grade-chip { margin-left:8px; font-size:11px; padding:2px 8px; border-radius:10px; color:#fff; font-weight:700; }
.g-P { background:#3b5998; } .g-M { background:#16a34a; } .g-D { background:#a8893a; }
.fridge { margin:8px 0; width:100%; }
.fridge-tray { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:10px; }
.fridge-note { width:100%; font-size:14px; color:#555; }
.fz-item { font-family:inherit; font-size:16px; padding:10px 16px; border:2px solid var(--line); background:#fff; border-radius:24px; cursor:pointer; }
.fz-item.on { border-color: var(--pri); background: var(--pri); color:#fff; font-weight:700; }
.fridge-body { display:grid; grid-template-columns:2fr 1fr; gap:10px; width:100%; background:#eef6fb; border:3px solid #9bb7c8; border-radius:14px; padding:10px; }
.fridge-shelves, .fridge-door { display:flex; flex-direction:column; gap:8px; }
.fz { font-family:inherit; text-align:left; background:#fff; border:2px dashed var(--line); border-radius:10px; padding:8px 10px; min-height:64px; cursor:default; }
.fz.ready { border-color: var(--pri); cursor:pointer; background:#fff8f0; }
.fz-label { font-weight:700; color: var(--dark); font-size:13px; }
.fz-items { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
.fz-chip { font-size:14px; padding:4px 10px; border-radius:14px; cursor:pointer; }
.fz-chip.ok { background:#dcfce7; color:#166534; } .fz-chip.bad { background:#fee2e2; color:#991b1b; }
.budget { border:1px solid var(--line); border-radius:8px; overflow:hidden; background:#fff; max-width:560px; }
.budget-bar { background: var(--dark); color:#fff; padding:8px 12px; font-weight:700; }
.budget-bar.alt { background: var(--pri); }
.budget-body { padding:10px 12px; }
.budget-row { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:8px; }
.budget-row > input:first-child { flex:1; }
.budget-amt { width:110px; text-align:right; }
.budget-totals { padding:12px; background:#f7f7f5; border-top:1px solid var(--line); }
.budget-totals > div { display:flex; justify-content:space-between; margin-bottom:4px; }
.budget-bal { font-size:17px; margin-top:6px; padding-top:6px; border-top:1px solid var(--line); }
.budget .pos { color: var(--dark); } .budget .neg { color: var(--red); }
.budget .list-count { padding:0 12px 10px; }
.obs .obs-row { display:flex; gap:14px; flex-wrap:wrap; margin-bottom:8px; }
.obs .obs-row label { font-size:13px; display:flex; flex-direction:column; gap:3px; }
.obs .obs-support { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
.obs .obs-support label { border:1.5px solid var(--asr-bd); background:#fff; border-radius:16px; padding:4px 12px; font-size:13px; cursor:pointer; }
.obs .obs-support label.on { background: var(--asr); color:#fff; border-color: var(--asr); }
.obs .obs-support input { display:none; }
.obs textarea { width:100%; }
.ev-note-item label { display:block; font-size:12px; color:#555; margin-bottom:3px; }
.ev-note-item input { width:100%; }
.pref-row { display:flex; justify-content:space-between; align-items:center; margin:10px 0; gap:10px; }
.pref-row .btn { margin:0 3px 0 0; }

@media print {
  @page { margin: 15mm 12mm; size: A4; }
  .no-print { display:none !important; }
  .print-only { display:block !important; }
  body { background:#fff !important; font-size:12pt; }
  main { padding:0; zoom:1 !important; }
  .khub, .info, .src-card { break-inside:auto; }
  .khub-head, .card-bar, .src-head { background:#fff !important; color:#000 !important; border-bottom:2px solid #000; }
  .prompt-hint { background:#fff; }
  .speak, .model, .continue { display:none !important; }
  .contents-link { border:none; padding:2px 0; }
  .lohead, .kb { background:#fff !important; color:#000 !important; border-color:#000; }
  .crit-marks { border-color:#999; background:#fff; }
  .crit-row .mark-picker { display:none !important; }
  .page { margin:0 auto 10px; max-width:none; }
  .ta-screen { display:none !important; }
  .ta-print { display:block !important; white-space:pre-wrap; word-break:break-word; overflow-wrap:anywhere; line-height:1.5; min-height:16px; border:1px solid #ccc; border-radius:4px; padding:8px; background:#fff; }
  span.ta-print { display:inline-block !important; padding:2px 8px; }
  .name-print { text-align:center; display:inline-block !important; min-width:260px; }
  .list-print { flex:1; }
  .card { break-inside:auto; border-color:#bbb; }
  .fb { display:none !important; }
  .print-fb .fb { display:block !important; }
  .mark-badge { border:1px solid #999; }
  .print-section { break-after:page; }
  .print-section:last-child { break-after:auto; }
  h2, h3 { break-after:avoid; }
  .ev-ac { break-inside:avoid; }
  audio { display:none !important; }
}

/* generic side-by-side layout for a task + a supporting diagram */
.blk-row { display:flex; gap:20px; align-items:flex-start; flex-wrap:wrap; margin:10px 0; }
.blk-row-item { flex:1 1 280px; min-width:0; }
.blk-svg { margin:0; padding:12px; background:#fff; border:1px solid var(--line); border-radius:10px; text-align:center; }
.blk-svg > div { display:inline-block; max-width:100%; }
.blk-svg svg { max-width:100%; height:auto; display:block; }
.blk-caption { font-size:12px; color:#666; margin-top:8px; }
@media (max-width: 640px) { .blk-row { flex-direction:column; } }

/* sequencing (put in order) */
.seq-list { list-style:none; padding:0; margin:0 0 10px; display:flex; flex-direction:column; gap:8px; }
.seq-list li { display:flex; align-items:center; gap:10px; background:#fff; border:1.5px solid var(--line); border-radius:10px; padding:10px 12px; }
.seq-list li.seq-ok { border-color:#16a34a; background:#f0fdf4; }
.seq-list li.seq-bad { border-color:#dc2626; background:#fef2f2; }
.seq-text { flex:1; }
.seq-btns { display:flex; gap:4px; }
.seq-btns button { width:30px; height:30px; border-radius:6px; border:1px solid var(--line); background:#f7f7f5; font-size:15px; cursor:pointer; }
.seq-btns button:disabled { opacity:.3; cursor:default; }
.seq-mark { font-weight:700; width:20px; text-align:center; }
.seq-ok .seq-mark { color:#16a34a; } .seq-bad .seq-mark { color:#dc2626; }

/* hotspot diagram */
.hotspot { margin:10px 0; }
.hotspot-stage { position:relative; display:inline-block; max-width:100%; background:#fff; border:1px solid var(--line); border-radius:10px; padding:10px; }
.hotspot-img { max-width:100%; }
.hotspot-img svg { max-width:100%; height:auto; display:block; }
.hs-dot { position:absolute; transform:translate(-50%,-50%); width:28px; height:28px; border-radius:50%; background:var(--pri); color:#fff; border:2px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,.35); font-weight:700; font-size:13px; cursor:pointer; }
.hs-dot.seen { background:var(--dark); }
.hs-dot.on { background:#E8A33D; box-shadow:0 0 0 4px rgba(232,163,61,.35); }
.hotspot-cards { margin-top:10px; display:flex; flex-direction:column; gap:6px; }
.hs-card { border:1px solid var(--line); border-radius:8px; overflow:hidden; }
.hs-card-head { width:100%; text-align:left; background:#f7f7f5; border:none; padding:8px 12px; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:8px; }
.hs-card.open .hs-card-head { background:var(--light); }
.hs-num { display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; border-radius:50%; background:var(--pri); color:#fff; font-size:11px; font-weight:700; }
.hs-check { margin-left:auto; color:#16a34a; }
.hs-card-body { padding:8px 12px 12px 40px; font-size:14px; color:#333; }
.hotspot-progress { font-size:12px; color:#666; margin-top:6px; }

/* live calculator */
.calc { background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px; max-width:460px; }
.calc-title { font-weight:700; color:var(--dark); margin-bottom:10px; }
.calc-inputs { display:flex; flex-direction:column; gap:10px; }
.calc-field { display:flex; flex-direction:column; gap:4px; font-size:13px; font-weight:600; color:#444; }
.calc-inputwrap { display:flex; align-items:center; gap:6px; }
.calc-inputwrap input { width:120px; padding:6px 8px; border:1px solid var(--line); border-radius:6px; font-size:15px; }
.calc-unit { color:#777; font-size:13px; }
.calc-result { margin-top:12px; padding-top:10px; border-top:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; font-size:15px; }
.calc-result strong { color:var(--pri); font-size:19px; }
.calc-note { margin-top:8px; font-size:12px; color:#777; }

/* self-check quiz */
.quiz-q { margin-bottom:16px; }
.quiz-prompt { font-weight:600; margin-bottom:8px; }
.quiz-opts { display:flex; flex-direction:column; gap:6px; }
.quiz-opt { text-align:left; padding:8px 12px; border:1.5px solid var(--line); border-radius:8px; background:#fff; cursor:pointer; }
.quiz-opt:disabled { cursor:default; }
.quiz-opt.correct { border-color:#16a34a; background:#f0fdf4; font-weight:700; }
.quiz-opt.wrong { border-color:#dc2626; background:#fef2f2; }
.quiz-fb { margin-top:6px; font-size:13px; padding:8px 10px; border-radius:6px; }
.quiz-fb.ok { background:#f0fdf4; color:#166534; }
.quiz-fb.bad { background:#fef2f2; color:#991b1b; }
.quiz-score { font-size:13px; font-weight:600; color:var(--dark); }
</style>
