*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",Tahoma,Geneva,Verdana,sans-serif;background:#f0f4f8;color:#1a1a2e}

.section-title h2{font-size:20px;color:#0f1e3d;margin-bottom:14px;border-bottom:2px solid #1a2e5a;padding-bottom:6px}
.card{background:#fff;border:1px solid #d4d4cc;border-radius:8px;padding:16px;margin-bottom:14px;font-size:13px;line-height:1.6}

.card ul{margin:8px 0 8px 20px}
.card li{margin-bottom:6px}
.card-header{background:#1a2e5a;color:#fff;padding:10px 14px;border-radius:8px 8px 0 0}
.card-header h2{font-size:15px}
.card-header + .card{border-top:none;border-radius:0 0 8px 8px;margin-top:0}
.btn-ghost{background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);color:#fff;padding:5px 10px;border-radius:6px;font-size:11px;cursor:pointer}
.btn-ghost:hover{background:rgba(255,255,255,0.25)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.6}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

@media print{

  .ta-screen{display:none!important}
  .ta-print{display:block!important}
  body{background:#fff}
  main{max-width:100%!important}
  section{page-break-inside:avoid}
