/* ── AudioRecorder ────────────────────────────── */
const AudioRecorder=({onSave,disabled=false})=>{
  const [state,setState]=useState("idle");
  const [secs,setSecs]=useState(0);
  const mrRef=useRef(null),chunksRef=useRef([]),timerRef=useRef(null);
  const start=async()=>{
    if(disabled)return;
    setState("requesting");
    try{
      const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      const mr=new MediaRecorder(stream);
      mrRef.current=mr;chunksRef.current=[];
      mr.ondataavailable=e=>{if(e.data.size>0)chunksRef.current.push(e.data)};
      mr.onstop=()=>{
        stream.getTracks().forEach(t=>t.stop());
        const blob=new Blob(chunksRef.current,{type:"audio/webm"});
        const reader=new FileReader();
        reader.onload=ev=>{onSave(ev.target.result,"recording.webm");setState("idle");setSecs(0)};
        reader.readAsDataURL(blob);setState("saving");
      };
      mr.start();setState("recording");setSecs(0);
      timerRef.current=setInterval(()=>setSecs(s=>s+1),1000);
    }catch(e){setState("idle");alert("Microphone access denied.");}
  };
  const stop=()=>{if(mrRef.current&&mrRef.current.state==="recording")mrRef.current.stop();clearInterval(timerRef.current)};
  const fmt=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
  if(disabled)return null;
  if(state==="idle")return(<button onClick={start} style={{marginTop:4,display:"flex",alignItems:"center",gap:5,padding:"5px 12px",background:BLUE_LT,border:`1px solid ${BLUE}`,borderRadius:5,color:BLUE,fontSize:12,fontWeight:600,cursor:"pointer"}}><svg width="12" height="12" viewBox="0 0 24 24" fill={BLUE}><path d="M12 1a4 4 0 0 1 4 4v7a4 4 0 0 1-8 0V5a4 4 0 0 1 4-4zm-6 10a6 6 0 0 0 12 0h2a8 8 0 0 1-7 7.93V21h-2v-2.07A8 8 0 0 1 4 11h2z"/></svg>Record audio</button>);
  if(state==="requesting")return <span style={{fontSize:12,color:MG,marginTop:4,display:"block"}}>Requesting microphone…</span>;
  if(state==="recording")return(<button onClick={stop} style={{marginTop:4,display:"flex",alignItems:"center",gap:6,padding:"5px 12px",background:RED_LT,border:`1px solid ${RED}`,borderRadius:5,color:RED,fontSize:12,fontWeight:600,cursor:"pointer",animation:"pulse 1.2s infinite"}}><span style={{width:8,height:8,borderRadius:"50%",background:RED,display:"inline-block"}}/>Stop — {fmt(secs)}</button>);
  if(state==="saving")return <span style={{fontSize:12,color:MG,marginTop:4,display:"block"}}>Saving…</span>;
  return null;
};

/* ── TA ──────────────────────────────────────── */
const TA=({value,onChange,rows=5,ph="Write your answer here…",disabled=false,recordings,onAddRecording})=>{
  const hasRec=recordings&&recordings.length>0;
  return(<div>
    <textarea className="ta-screen" rows={rows} style={{background:disabled?"#F7F7F5":"#fff",color:disabled?"#6B6B6B":"#1A1A1A"}} value={value||""} onChange={e=>!disabled&&onChange(e.target.value)} placeholder={ph} readOnly={disabled}/>
    <div className="ta-print">{value||<span style={{color:"#9ca3af",fontStyle:"italic"}}>{ph}</span>}</div>
    {!disabled&&onAddRecording&&<AudioRecorder disabled={false} onSave={(b64,name)=>onAddRecording({b64,name,id:Date.now()})}/>}

const EvidenceSection=({data,update,am})=>{
  const items=data.evidence_items||[];
  const addItem=()=>update({evidence_items:[...items,mkEvItem()]});
  const patchItem=(id,patch)=>update({evidence_items:items.map(it=>it.id===id?{...it,...patch}:it)});

  };
  return(<div>
    <div style={{background:LG,border:`1.5px solid ${G}`,borderRadius:7,padding:"10px 14px",marginBottom:16,fontSize:13,color:"#1a3a2a"}}>Upload activity photos, skill development videos/audio reflections, certificates, or any other supporting evidence.</div>
    {items.map(it=>(<div key={it.id} style={{border:`1.5px solid ${BD}`,borderRadius:8,padding:14,marginBottom:12,background:"#fff"}}><div style={{display:"flex",gap:12,alignItems:"flex-start"}}><div style={{flexShrink:0}}><Thumb it={it}/>{!am&&<label style={{display:"block",marginTop:6,padding:"4px 8px",background:LG,border:`1px solid ${G}`,borderRadius:4,fontSize:11,fontWeight:600,color:G,cursor:"pointer",textAlign:"center"}}>Upload<input type="file" accept="image/*,audio/*" style={{display:"none"}} onChange={e=>handleFile(it.id,e.target.files[0])}/></label>}</div><div style={{flex:1}}>{it.b64&&it.mediaType==="audio"&&<audio controls src={it.b64} style={{width:"100%",marginBottom:8,height:36}}/>}<textarea className="ta-screen" rows={3} value={it.desc||""} readOnly={am} onChange={e=>!am&&patchItem(it.id,{desc:e.target.value})} placeholder="Describe what this shows…" style={{background:am?"#F7F7F5":"#fff"}}/><div className="ta-print">{it.desc||""}</div><div style={{marginTop:8}}><div style={{fontSize:11,fontWeight:600,color:MG,marginBottom:5,textTransform:"uppercase",letterSpacing:".04em"}}>Evidence for:</div><div style={{display:"flex",flexWrap:"wrap",gap:4}}>{allACs.map(ac=>(<label key={ac} style={{display:"flex",alignItems:"center",gap:3,padding:"2px 8px",border:`1px solid ${(it.acs||[]).includes(ac)?G:BD}`,borderRadius:12,fontSize:11,cursor:am?"default":"pointer",background:(it.acs||[]).includes(ac)?LG:"#fff",color:(it.acs||[]).includes(ac)?G:MG}}><input type="checkbox" checked={(it.acs||[]).includes(ac)} disabled={am} onChange={e=>{const next=e.target.checked?[...(it.acs||[]),ac]:(it.acs||[]).filter(a=>a!==ac);patchItem(it.id,{acs:next});}} style={{accentColor:G}}/>AC {ac}</label>))}</div></div></div>{!am&&<button onClick={()=>removeItem(it.id)} style={{background:"none",border:"none",color:RED,fontSize:18,cursor:"pointer",padding:"2px 6px",flexShrink:0}}>&#215;</button>}</div></div>))}

/* ═══════════════════════════════════════════════
   APP
═══════════════════════════════════════════════ */
function App(){
  const load=()=>{try{const s=localStorage.getItem(UNIT_KEY);if(s){const p=JSON.parse(s);return{...init(),...p};}}catch(e){}return init();};
  const [data,setData]=useState(load);
  const [sec,setSec]=useState("cover");
  const [printing,setPrinting]=useState(false);
  const [showPwd,setShowPwd]=useState(false);
  const [pwd,setPwd]=useState("");
  const [pwdErr,setPwdErr]=useState("");
  const [showPrint,setShowPrint]=useState(false);
  const [printMode,setPrintMode]=useState("full");
  const saveTimer=useRef(null);

  const update=useCallback(patch=>{setData(d=>({...d,...patch}));},[]);
  useEffect(()=>{clearTimeout(saveTimer.current);saveTimer.current=setTimeout(()=>{try{localStorage.setItem(UNIT_KEY,JSON.stringify(data));}catch(e){}},600);},[data]);
  useEffect(()=>{if(!printing)return;const originalTitle=document.title;const namePart=(data.studentName||"").trim().replace(/\s+/g,"");const modeSuffix=printMode==="ev"?"EV":printMode==="section"?`Section${sec.charAt(0).toUpperCase()+sec.slice(1)}`:"Complete";document.title=`HB93CY004SkillsDevelopment${modeSuffix}${namePart}`;const t=setTimeout(()=>{window.print();document.title=originalTitle;setPrinting(false);const s=document.getElementById("ev-cover-strip");if(s)s.style.display="none";},200);return()=>clearTimeout(t);},[printing]);

  const am=data.assessorMode;
  const upd=f=>v=>update({[f]:v});
  const updRec=fk=>(r,did)=>{const ex=data.recordings?.[fk]||[];let u;if(r===null){u=ex.filter(x=>x.id!==did);}else{u=[...ex,r];}update({recordings:{...(data.recordings||{}),[fk]:u}});};
  const acStatus=id=>(data.ac_status||{})[id]||"";
  const setACStatus=(id,v)=>update({ac_status:{...(data.ac_status||{}),[id]:v}});
  const loFb=id=>(data.lo_feedback||{})[id]||"";
  const setLOFeedback=(id,v)=>update({lo_feedback:{...(data.lo_feedback||{}),[id]:v}});

  const totalHours=()=>(data.participation_log||[]).reduce((s,r)=>s+(parseFloat(r.duration)||0),0).toFixed(1);

  const fields=["ac11_activity","ac11_rationale","ac12_short_goals","ac12_long_goals","participation_log","ac22_progression","ac31_evaluation","ac32_goal_review","ac32_new_goals","ac41_employability","ac42_enjoyment","ac42_challenge","ac42_independence"];
  const filled=fields.filter(f=>{const v=data[f];if(Array.isArray(v))return v.some(r=>Object.values(r).some(x=>String(x||"").trim().length>3));return String(v||"").trim().length>3;}).length;
  const pct=Math.round((filled/fields.length)*100);

  const exportJSON=()=>{const exp={...data,_unit:UNIT_CODE,_exported:new Date().toISOString()};const blob=new Blob([JSON.stringify(exp,null,2)],{type:"application/json"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=`HB93CY004Workbook${(data.studentName||"Student").replace(/\s+/g,"")}.json`;a.click();URL.revokeObjectURL(url);};
  const importJSON=e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=ev=>{try{const p=JSON.parse(ev.target.result);if(p._unit&&p._unit!==UNIT_CODE){alert(`Wrong workbook file. Expected ${UNIT_CODE}, got ${p._unit}.`);return;}setData({...init(),...p});alert("Workbook loaded.");}catch(err){alert("Could not read file.");}};reader.readAsText(file);e.target.value="";};

  const enterAM=()=>{if(pwd===ASSESSOR_PASS){update({assessorMode:true});setShowPwd(false);setPwd("");setPwdErr("");}else{setPwdErr("Incorrect password.");}};
  const exitAM=()=>update({assessorMode:false});
  const doPrint=()=>{if(printMode==="ev"){document.getElementById("ev-cover-strip").style.display="block";}setShowPrint(false);setPrinting(true);};

  const resultColour={"DISTINCTION":"#7c3aed","MERIT":BLUE,"PASS":G,"REFER":RED,"PENDING":MG};
  const headerBg=am?ASSESSOR_BG:G;

  // Log helpers
  const updLog=(id,field,val)=>update({participation_log:(data.participation_log||[]).map(r=>r.id===id?{...r,[field]:val}:r)});
  const addLog=()=>update({participation_log:[...(data.participation_log||[]),mkLog()]});
  const removeLog=id=>(data.participation_log||[]).length>1?update({participation_log:(data.participation_log||[]).filter(r=>r.id!==id)}):null;

  const navItems=[{id:"cover",label:"Cover"},{id:"contents",label:"Contents"},{id:"intro",label:"Introduction"},{id:"lo1",label:"LO 1"},{id:"lo2",label:"LO 2"},{id:"lo3",label:"LO 3"},{id:"lo4",label:"LO 4"},{id:"evidence",label:"Evidence"},{id:"checklist",label:"Checklist"},{id:"glossary",label:"Glossary"}];

  return(
    <div style={{minHeight:"100vh",background:"#f5f5f3"}}>
      <div id="ev-cover-strip" style={{display:"none",background:DG,color:"#fff",padding:"16px 24px",marginBottom:12}}>
        <div style={{fontWeight:700,fontSize:16,marginBottom:6}}>EV SUMMARY — {UNIT_CODE} {UNIT_TITLE}</div>
        <div style={{fontSize:13,display:"flex",gap:24,flexWrap:"wrap"}}><span>Student: <strong>{data.studentName||"—"}</strong></span><span>Class: <strong>{data.className||"—"}</strong></span><span>Assessor: <strong>{data.assessorName||"—"}</strong></span><span>Activity: <strong>{data.chosen_activity||"—"}</strong></span><span>Total hours: <strong>{totalHours()}</strong></span><span>Result: <strong>{data.overall_result||"PENDING"}</strong></span><span>Marked: <strong>{data.markedDate||"—"}</strong></span></div>
      </div>

      {/* Header */}
      <div className="wb-header no-print" style={{position:"sticky",top:0,zIndex:100,background:headerBg,color:"#fff",padding:"0 16px",height:64,boxSizing:"border-box",display:"flex",alignItems:"center",justifyContent:"space-between",boxShadow:"0 2px 8px rgba(0,0,0,.15)",transition:"background .3s"}}>
        <div style={{display:"flex",flexDirection:"column",lineHeight:1.2}}><span style={{fontWeight:700,fontSize:14}}>{UNIT_CODE} — {UNIT_TITLE}</span><span style={{fontSize:11,opacity:.8}}>{UNIT_SUBTITLE}</span></div>

        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <span style={{background:"rgba(255,255,255,.18)",fontSize:11,fontWeight:700,padding:"2px 8px",borderRadius:8}}>{pct}% done</span>
          {am&&<span style={{background:ASSESSOR_BD,fontSize:11,fontWeight:700,padding:"2px 8px",borderRadius:8,color:"#fff"}}>ASSESSOR MODE</span>}
          <button onClick={exportJSON} style={{background:"rgba(255,255,255,.15)",border:"1px solid rgba(255,255,255,.35)",color:"#fff",borderRadius:5,padding:"4px 10px",fontSize:11,fontWeight:600,cursor:"pointer"}}>↓ Save</button>
          <label style={{background:"rgba(255,255,255,.15)",border:"1px solid rgba(255,255,255,.35)",color:"#fff",borderRadius:5,padding:"4px 10px",fontSize:11,fontWeight:600,cursor:"pointer"}}>↑ Load<input type="file" accept=".json" style={{display:"none"}} onChange={importJSON}/></label>

        </div>

      {/* Sub-header */}
      <div className="no-print" style={{position:"sticky",top:64,zIndex:99,height:41,boxSizing:"border-box",background:am?ASSESSOR_BG:"#fff",borderBottom:`2px solid ${am?ASSESSOR_BD:BD}`,padding:"6px 16px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        {am?<><span style={{fontSize:12,fontWeight:600,color:"#fff"}}>ASSESSOR MODE — You are marking this workbook.</span><button onClick={exitAM} style={{background:"rgba(255,255,255,.2)",border:"1px solid rgba(255,255,255,.4)",color:"#fff",borderRadius:5,padding:"4px 12px",fontSize:12,fontWeight:600,cursor:"pointer"}}>Exit Assessor Mode</button></>:<><span style={{fontSize:12,color:MG}}>Student mode — your answers are editable.</span><button onClick={()=>setShowPwd(true)} style={{background:LG,border:`1px solid ${G}`,color:G,borderRadius:5,padding:"4px 12px",fontSize:12,fontWeight:600,cursor:"pointer"}}>Enter Assessor Mode</button></>}
      </div>

      {/* Nav */}
      <div className="no-print" style={{position:"sticky",top:105,zIndex:98,background:"#fff",borderBottom:`2px solid ${LG}`,overflowX:"auto",display:"flex",alignItems:"stretch",whiteSpace:"nowrap",boxShadow:"0 2px 4px rgba(0,0,0,.05)"}}>
        {navItems.map(n=>(<button key={n.id} onClick={()=>setSec(n.id)} style={{padding:"10px 14px",border:"none",borderBottom:`3px solid ${sec===n.id?G:"transparent"}`,background:"none",fontWeight:sec===n.id?700:400,color:sec===n.id?G:MG,fontSize:13,cursor:"pointer",transition:"all .15s",flexShrink:0}}>{n.label}</button>))}
      </div>

      {/* Modals */}
      {showPwd&&(<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.5)",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center"}}><div style={{background:"#fff",borderRadius:12,padding:28,width:340,boxShadow:"0 8px 32px rgba(0,0,0,.2)"}}><div style={{fontWeight:700,fontSize:16,color:ASSESSOR_BG,marginBottom:16}}>Assessor Mode</div><input type="password" value={pwd} onChange={e=>setPwd(e.target.value)} onKeyDown={e=>e.key==="Enter"&&enterAM()} placeholder="Password" autoFocus style={{marginBottom:8,border:`1.5px solid ${pwdErr?RED:BD}`}}/>{pwdErr&&<div style={{color:RED,fontSize:12,marginBottom:8}}>{pwdErr}</div>}<div style={{display:"flex",gap:8,marginTop:4}}><button onClick={enterAM} style={{flex:1,background:ASSESSOR_BG,color:"#fff",border:"none",borderRadius:6,padding:"9px",fontWeight:700,cursor:"pointer"}}>Enter</button><button onClick={()=>{setShowPwd(false);setPwd("");setPwdErr("");}} style={{flex:1,background:LGR,color:MG,border:`1px solid ${BD}`,borderRadius:6,padding:"9px",cursor:"pointer"}}>Cancel</button></div></div></div>)}
      {showPrint&&(<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.5)",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center"}}><div style={{background:"#fff",borderRadius:12,padding:28,width:360,boxShadow:"0 8px 32px rgba(0,0,0,.2)"}}><div style={{fontWeight:700,fontSize:16,color:DG,marginBottom:14}}>Print Options</div>{[["full","Complete workbook"],["section","Current section only"],["ev","EV Summary"]].map(([v,l])=>(<label key={v} style={{display:"flex",alignItems:"center",gap:8,marginBottom:10,cursor:"pointer",fontSize:14}}><input type="radio" name="pm" value={v} checked={printMode===v} onChange={()=>setPrintMode(v)} style={{accentColor:G}}/>{l}</label>))}<div style={{display:"flex",gap:8,marginTop:12}}><button onClick={doPrint} style={{flex:1,background:G,color:"#fff",border:"none",borderRadius:6,padding:"9px",fontWeight:700,cursor:"pointer"}}>Print</button><button onClick={()=>setShowPrint(false)} style={{flex:1,background:LGR,color:MG,border:`1px solid ${BD}`,borderRadius:6,padding:"9px",cursor:"pointer"}}>Cancel</button></div></div></div>)}
      {am&&data.overall_result&&(<div style={{background:resultColour[data.overall_result]||MG,color:"#fff",padding:"10px 20px",textAlign:"center",fontWeight:700,fontSize:15}}>
        {data.overall_result==="DISTINCTION"&&"Result: DISTINCTION — Exceptional work. All criteria met to the highest standard."}
        {data.overall_result==="MERIT"&&"Result: MERIT — Very good work. All criteria met with depth and understanding."}
        {data.overall_result==="PASS"&&"Result: PASS — Well done! All criteria have been met."}
        {data.overall_result==="REFER"&&"Result: REFER — Some criteria need more work. See assessor feedback below."}
        {data.overall_result==="PENDING"&&"Result: PENDING — Your assessor is still marking your work."}
      </div>)}

      <div style={{maxWidth:860,margin:"0 auto",padding:"24px 16px"}}>

        {/* COVER */}
        {(sec==="cover"||(printing&&printMode!=="section"))&&(
          <div className="wb-section">
            <div style={{background:DG,borderRadius:12,padding:"36px 32px",color:"#fff",marginBottom:20,textAlign:"center"}}>
              <div style={{fontSize:13,letterSpacing:".1em",textTransform:"uppercase",opacity:.75,marginBottom:8}}>{UNIT_CODE} — Level 3</div>
              <h1 style={{fontSize:26,fontWeight:800,marginBottom:8,lineHeight:1.2}}>Skills Development through<br/>Outdoor Learning</h1>
              <div style={{fontSize:14,opacity:.8,marginBottom:24}}>Agored Cymru Level 3 | 4 Credits | 36 GLH</div>
              <div style={{display:"flex",justifyContent:"center",gap:16,flexWrap:"wrap"}}><img src={LOGO_SRC} alt="Brynllywarch" style={{height:52,objectFit:"contain"}}/><img src={AGORED_LOGO_SRC} alt="Agored Cymru" style={{height:40,objectFit:"contain",marginTop:6}}/></div>
            </div>
            <div style={{background:"#fff",borderRadius:10,padding:22,border:`1.5px solid ${BD}`,marginBottom:16}}>
              <div style={{fontWeight:700,fontSize:15,color:G,marginBottom:14}}>Student Details</div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
                <Inp label="Full Name" value={data.studentName} onChange={upd("studentName")} ph="Your full name" disabled={am}/>
                <Inp label="Class / Group" value={data.className} onChange={upd("className")} ph="e.g. Year 12A" disabled={am}/>
                <Inp label="Assessor" value={data.assessorName} onChange={upd("assessorName")} ph="Assessor's name" disabled={am}/>
                <Inp label="Start Date" value={data.startDate} onChange={upd("startDate")} type="date" disabled={am}/>
              </div>
              <Inp label="Chosen Outdoor Activity" value={data.chosen_activity} onChange={upd("chosen_activity")} ph="e.g. Mountain biking at Coed y Brenin, Sea kayaking, Rock climbing at Dinas Rock…" disabled={am}/>
            </div>
            <div style={{background:"#fff",borderRadius:10,padding:22,border:`1.5px solid ${BD}`,marginBottom:16}}>
              <div style={{fontWeight:700,fontSize:14,color:G,marginBottom:10}}>About This Unit</div>
              <p style={{fontSize:13,lineHeight:1.6,color:"#333",marginBottom:10}}>This unit is about developing your skills through active participation in an outdoor activity of your choice over a minimum of 12 hours. You will set personal goals, participate, track your progress, and reflect on how the experience has developed your skills and employability.</p>
              <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8,marginTop:14}}>
                {[["LO 1","Activity Selection & Goals","2 ACs"],["LO 2","Participate","2 ACs"],["LO 3","Review Goals","2 ACs"],["LO 4","Skills Analysis","2 ACs"]].map(([lo,t,acs])=>(
                  <div key={lo} style={{background:LG,borderRadius:7,padding:"10px 12px",border:`1.5px solid ${G}`,textAlign:"center"}}><div style={{fontWeight:800,fontSize:16,color:G}}>{lo}</div><div style={{fontSize:12,fontWeight:600,color:DG,marginTop:2}}>{t}</div><div style={{fontSize:11,color:MG,marginTop:2}}>{acs}</div></div>
                ))}
              </div>
            </div>
            <div style={{background:AMBER_LT,border:`1.5px solid ${AMBER}`,borderRadius:8,padding:"12px 16px",fontSize:13,color:"#78350f",marginBottom:16}}>
              <strong>Participation requirement:</strong> AC 2.1 requires a minimum of <strong>12 hours</strong> of participation in your chosen activity. AC 2.1 and AC 2.2 both require direct assessor observation. Use the participation log in LO 2 to record your hours.
            </div>
            <ContinueBtn label="View Contents →" onClick={()=>setSec("contents")}/>
          </div>
        )}

        {/* CONTENTS */}
        {(sec==="contents"||(printing&&printMode!=="section"))&&(
          <div className="wb-section">
            <h2 style={{color:G,fontWeight:700,fontSize:20,marginBottom:18,borderBottom:`2px solid ${G}`,paddingBottom:8}}>Contents</h2>
            {[{s:"intro",label:"Introduction"},{s:"lo1",label:"LO 1 — Activity Selection & Goals",sub:"Knowledge Hub + Assessment: ACs 1.1–1.2"},{s:"lo2",label:"LO 2 — Participate in the Activity",sub:"Knowledge Hub + Participation Log + Assessment: ACs 2.1–2.2 (includes observation)"},{s:"lo3",label:"LO 3 — Review Personal Goals",sub:"Knowledge Hub + Assessment: ACs 3.1–3.2"},{s:"lo4",label:"LO 4 — Skills Development Analysis",sub:"Knowledge Hub + Assessment: ACs 4.1–4.2"},{s:"evidence",label:"Photo & Audio Evidence"},{s:"checklist",label:"Assessment Checklist & Declaration"},{s:"glossary",label:"Glossary"}].map((it,i)=>(<div key={i} onClick={()=>setSec(it.s)} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"12px 16px",borderRadius:7,marginBottom:6,cursor:"pointer",background:sec===it.s?LG:"#fff",border:`1.5px solid ${sec===it.s?G:BD}`,transition:"all .15s"}} onMouseEnter={e=>e.currentTarget.style.borderColor=G} onMouseLeave={e=>e.currentTarget.style.borderColor=sec===it.s?G:BD}><div><div style={{fontWeight:600,fontSize:14,color:G}}>{it.label}</div>{it.sub&&<div style={{fontSize:11,color:MG,marginTop:2}}>{it.sub}</div>}</div><span style={{color:G,fontSize:18}}>→</span></div>))}
          </div>
        )}

        {/* INTRO */}
        {(sec==="intro"||(printing&&printMode!=="section"))&&(
          <div className="wb-section">
            <h2 style={{color:G,fontWeight:700,fontSize:20,marginBottom:16,borderBottom:`2px solid ${G}`,paddingBottom:8}}>Introduction</h2>
            <KB title="What This Unit Is About" items={[
              "This unit is personal and reflective — it is built around <em>your</em> chosen outdoor activity, <em>your</em> goals, and <em>your</em> development. There are no right or wrong activities to choose.",
              "The activity can be one you already participate in (to further develop skills) or a new activity (to develop new skills). Both are valid — you just need to justify your choice.",
              "<strong>12 hours minimum participation</strong> is required for AC 2.1. This should be spread across multiple sessions, not a single event. Use the participation log to record every session.",
              "Level 3 command words: <em>select and provide a rationale, explain, evaluate, review, set new goals</em>. Your responses should be detailed and analytical.",
            ]}/>
            <KB title="Choosing Your Activity" items={[
              "You must choose ONE outdoor activity to use consistently throughout the whole unit.",
              "Examples of suitable activities: mountain biking, kayaking/canoeing, rock climbing, hill walking, gorge walking, orienteering, sea kayaking, stand-up paddleboarding, wild swimming, archery.",
              "The activity must be an outdoor learning activity — it should provide opportunities for skill development beyond just physical fitness.",
              "Your rationale (AC 1.1) must explain WHY you chose this activity for skills development — what specific skills will you work on?",
            ]}/>
            <KB title="SMART Goals" items={[
              "<strong>Specific:</strong> What exactly will you improve? (e.g. 'Improve my ability to read whitewater features to plan my line before paddling a Grade 2 rapid' — not just 'get better at kayaking')",
              "<strong>Measurable:</strong> How will you know when you've achieved it? (e.g. 'Successfully paddle three Grade 2 rapids without capsizing')",
              "<strong>Achievable:</strong> Is it realistic given your current level and the time available?",
              "<strong>Relevant:</strong> Does it relate to your chosen activity and your genuine development needs?",
              "<strong>Time-bound:</strong> When do you aim to achieve it? (Short-term: within this unit's 12 hours. Long-term: by end of academic year.)",
            ]}/>
            <ContinueBtn label="Begin LO 1 →" onClick={()=>setSec("lo1")}/>
          </div>
        )}

        {/* LO 1 */}
        {(sec==="lo1"||(printing&&printMode!=="section"))&&(
          <div className="wb-section">
            <LOHeader num={1} title="Select an Outdoor Activity Related to Own Goals for Skills Development"/>
            <KB title="Selecting Your Activity — What Makes a Good Choice?" items={[
              "An outdoor learning activity is one where the environment itself provides the learning opportunities — not just a backdrop. A paddle on a moving river develops water-reading, decision-making and risk-management skills that no gym session can replicate.",
              "Consider: What skills do you already have? What skills do you want to develop? Which activity best provides the environment to develop those skills?",
              "Your rationale should connect the activity to specific skill development goals — not just personal preference.",
              "If you are developing existing skills: explain what level you are at now and what the next stage of development looks like.",
              "If you are developing new skills: explain why this activity is the right vehicle for the skills you want to develop.",
            ]}/>
            <KB title="Short and Long Term Goals in Outdoor Learning" items={[
              "<strong>Short-term goals</strong> are achievable within the duration of this unit (12 hours of participation). They should be specific, observable skills or behaviours.",
              "<strong>Long-term goals</strong> extend beyond this unit — they may take months or years to achieve and may include qualification milestones (e.g. achieving a Star Award, completing a Leadership qualification).",
              "Examples of short-term goals: 'Successfully roll-up after capsizing three times by the end of the unit'; 'Complete a Grade 1 river descent without capsize'; 'Navigate a 10km off-road route using map and compass only'.",
              "Examples of long-term goals: 'Achieve Canoe Wales 3 Star by end of Year 13'; 'Lead a DofE Silver expedition route independently'; 'Complete Mountain Leader training by age 20'.",
              "Your goals in LO 1 will be reviewed in LO 3 — make them specific enough to evaluate meaningfully.",
            ]}/>
            <div style={{height:2,background:LG,borderRadius:2,margin:"22px 0"}}/>
            <div style={{background:DG,color:"#fff",borderRadius:6,padding:"8px 14px",fontSize:12,fontWeight:700,marginBottom:16,letterSpacing:".05em",textTransform:"uppercase"}}>Assessment Tasks — LO 1</div>
            <ACQ ac="1.1" am={am} label="Select your outdoor activity and provide a clear rationale for why you have chosen it for your skills development.">
              <Hint text="Name the specific activity. Your rationale must explain WHY you chose it — what skills will you develop, and why is this activity the best vehicle for that development? Connect to your current skill level."/>
              <div style={{display:"grid",gridTemplateColumns:"1fr 2fr",gap:10,marginBottom:8}}>
                <div><div style={{fontSize:12,fontWeight:600,color:MG,marginBottom:4,textTransform:"uppercase",letterSpacing:".04em"}}>Activity chosen</div><input type="text" value={data.ac11_activity||""} onChange={e=>!am&&update({ac11_activity:e.target.value})} placeholder="e.g. Mountain biking" disabled={am}/></div>
                <div><div style={{fontSize:12,fontWeight:600,color:MG,marginBottom:4,textTransform:"uppercase",letterSpacing:".04em"}}>Is this activity to further develop existing skills or develop new skills?</div><div style={{display:"flex",gap:8,marginTop:4}}>{["Further develop existing skills","Develop new skills in this activity"].map(v=>(<label key={v} style={{display:"flex",alignItems:"center",gap:6,fontSize:13,cursor:am?"default":"pointer",padding:"6px 10px",border:`1.5px solid ${data.ac11_type===v?G:BD}`,borderRadius:6,background:data.ac11_type===v?LG:"#fff"}}><input type="radio" name="skilltype" value={v} checked={data.ac11_type===v} onChange={e=>!am&&update({ac11_type:v})} disabled={am} style={{accentColor:G}}/>{v}</label>))}</div></div>
              </div>
              <div style={{fontSize:12,fontWeight:600,color:MG,marginBottom:4,textTransform:"uppercase",letterSpacing:".04em"}}>Rationale for choosing this activity</div>
              <TA value={data.ac11_rationale} onChange={upd("ac11_rationale")} rows={6} ph="I have chosen this activity because… The specific skills I want to develop are… I am currently at [level] and I want to progress to… This activity will develop these skills because…" disabled={am} recordings={data.recordings?.ac11_rationale||[]} onAddRecording={updRec("ac11_rationale")}/>
              {am&&<ACStatus id="1.1" status={acStatus("1.1")} onChange={v=>setACStatus("1.1",v)}/>}
            </ACQ>
            <ACQ ac="1.2" am={am} label="Explain how participating in this outdoor learning activity may contribute to your own short and long-term goals.">
              <Hint text="Write specific SMART goals — not vague aspirations. State each goal clearly and explain HOW the activity will help you achieve it. Minimum one short-term and one long-term goal."/>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
                <div>
                  <div style={{fontSize:12,fontWeight:600,color:G,marginBottom:4,padding:"6px 8px",background:LG,borderRadius:5}}>Short-term goals (achievable within this unit)</div>
                  <TA value={data.ac12_short_goals} onChange={upd("ac12_short_goals")} rows={6} ph={`Short-term goal 1: …
How participation will help achieve this: …

Short-term goal 2: …
How participation will help: …`} disabled={am} recordings={data.recordings?.ac12_short_goals||[]} onAddRecording={updRec("ac12_short_goals")}/>
                </div>
                <div>
                  <div style={{fontSize:12,fontWeight:600,color:DG,marginBottom:4,padding:"6px 8px",background:LG,borderRadius:5}}>Long-term goals (beyond this unit)</div>
                  <TA value={data.ac12_long_goals} onChange={upd("ac12_long_goals")} rows={6} ph={`Long-term goal 1: …
How this activity contributes to it: …

Long-term goal 2: …
Timeline and connection to the activity: …`} disabled={am} recordings={data.recordings?.ac12_long_goals||[]} onAddRecording={updRec("ac12_long_goals")}/>
                </div>
              </div>
              {am&&<ACStatus id="1.2" status={acStatus("1.2")} onChange={v=>setACStatus("1.2",v)}/>}
            </ACQ>
            <ResearchLinks items={[
              ["Canoe Wales — Paddlesport Pathway","https://canoewales.com/paddlesport-pathway","Skill progression awards and pathways for paddlesport in Wales"],
              ["Mountain Training — Walking and Climbing Awards","https://www.mountain-training.org/walking","Qualification and skills pathways for hill walking and climbing"],
              ["British Cycling — Mountain Bike Skills","https://www.britishcycling.org.uk/mtb","Skill progression frameworks for mountain biking"],
              ["DofE — Skills Section Guidance","https://www.dofe.org/about-dofe/the-programme/","Setting and evidencing personal development goals"],
            ]}/>
            <AssessorFeedback label="LO 1" value={loFb("lo1")} onChange={v=>setLOFeedback("lo1",v)} assessorMode={am}/>
            {!am&&<ContinueBtn label="Continue to LO 2 →" onClick={()=>setSec("lo2")}/>}
          </div>
        )}

        {/* LO 2 */}
        {(sec==="lo2"||(printing&&printMode!=="section"))&&(
          <div className="wb-section">
            <LOHeader num={2} title="Be Able to Participate Safely in the Outdoor Learning Activity"/>
            <KB title="Participation Requirements" items={[
              "<strong>Minimum 12 hours</strong> of participation in your chosen activity is required for AC 2.1. This can be spread across multiple sessions.",
              "Participation must be observed by your assessor. Sessions where your assessor is not present do not count toward the observed 12 hours.",
              "Record every session in the participation log below — date, duration, location, focus and conditions.",
              "Your assessor will observe you during these sessions and record evidence of your participation and skill progression for AC 2.1 and AC 2.2.",
              "Progress does not mean perfection — demonstrating that you have learned from mistakes and made adjustments counts as skill progression.",
            ]}/>
            <KB title="Skill Progression Models" items={[
              "<strong>The Learning Cycle (Kolb):</strong> Concrete Experience → Reflective Observation → Abstract Conceptualisation → Active Experimentation. Each session provides a new concrete experience; your written reflections in this workbook develop the other stages.",
              "<strong>Conscious Competence Model:</strong> Unconscious incompetence → Conscious incompetence → Conscious competence → Unconscious competence. Tracking where you are on this model for each skill is a powerful way to evaluate progression.",
              "<strong>Technical vs tactical skills:</strong> Technical skills are the physical execution (e.g. body position on a kayak, grip on a handhold). Tactical skills are decision-making (e.g. choosing a line on a river, reading terrain for navigation). Both should be addressed in your progression account.",
            ]}/>
            <div style={{height:2,background:LG,borderRadius:2,margin:"22px 0"}}/>
            <div style={{background:DG,color:"#fff",borderRadius:6,padding:"8px 14px",fontSize:12,fontWeight:700,marginBottom:16,letterSpacing:".05em",textTransform:"uppercase"}}>Assessment Tasks — LO 2</div>

            {/* Participation Log */}
            <div style={{border:`1.5px solid ${G}`,borderRadius:8,padding:"14px 16px",marginBottom:16,background:am?"#fafafa":"#fff"}}>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
                <div style={{display:"flex",alignItems:"center",gap:8}}>
                  <span style={{background:G,color:"#fff",fontSize:11,fontWeight:700,padding:"3px 8px",borderRadius:10}}>AC 2.1</span>
                  <span style={{fontWeight:600,fontSize:14}}>Participation Log — minimum 12 hours required</span>
                </div>
                <div style={{background:parseFloat(totalHours())>=12?G:AMBER,color:"#fff",fontWeight:700,fontSize:13,padding:"4px 12px",borderRadius:20}}>
                  {totalHours()} / 12.0 hrs
                </div>
              </div>
              <Hint text="Record every observed session. Hours count only when your assessor is present to observe. Add new rows for each session."/>
              <div style={{overflowX:"auto"}}>
                <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
                  <thead>
                    <tr style={{background:DG}}>
                      <th style={{padding:"7px 8px",color:"#fff",textAlign:"left",width:"10%"}}>Date</th>
                      <th style={{padding:"7px 8px",color:"#fff",textAlign:"center",width:"8%"}}>Hours</th>
                      <th style={{padding:"7px 8px",color:"#fff",textAlign:"left",width:"18%"}}>Location</th>
                      <th style={{padding:"7px 8px",color:"#fff",textAlign:"left",width:"30%"}}>Session focus / what we did</th>
                      <th style={{padding:"7px 8px",color:"#fff",textAlign:"left",width:"20%"}}>Conditions & notes</th>
                      <th style={{padding:"7px 8px",color:"#fff",textAlign:"left",width:"14%"}}>Progress observed</th>
                      {!am&&<th style={{width:"4%"}}></th>}
                    </tr>
                  </thead>
                  <tbody>
                    {(data.participation_log||[]).map((row,i)=>(
                      <tr key={row.id} style={{background:i%2===0?"#fff":"#F7FAF8"}}>
                        <td style={{padding:"4px 5px",borderBottom:"1px solid #E8F5EE"}}><input type="date" value={row.date||""} onChange={e=>updLog(row.id,"date",e.target.value)} disabled={am} style={{fontSize:11,padding:"3px 5px"}}/></td>
                        <td style={{padding:"4px 5px",borderBottom:"1px solid #E8F5EE",textAlign:"center"}}><input type="number" min="0" max="12" step="0.5" value={row.duration||""} onChange={e=>updLog(row.id,"duration",e.target.value)} disabled={am} style={{fontSize:11,padding:"3px 5px",textAlign:"center",width:"60px"}}/></td>
                        <td style={{padding:"4px 5px",borderBottom:"1px solid #E8F5EE"}}><input type="text" value={row.location||""} onChange={e=>updLog(row.id,"location",e.target.value)} disabled={am} placeholder="Site/location…" style={{fontSize:11,padding:"3px 5px"}}/></td>
                        <td style={{padding:"4px 5px",borderBottom:"1px solid #E8F5EE"}}><textarea className="ta-screen" rows={2} value={row.activity_focus||""} readOnly={am} onChange={e=>updLog(row.id,"activity_focus",e.target.value)} placeholder="What was the session focus?…" style={{width:"100%",fontSize:11,border:"1px solid #D4D4CC",borderRadius:3,padding:"3px 5px",resize:"vertical",background:am?"#F7F7F5":"#fff"}}/><div className="ta-print" style={{fontSize:11,padding:"3px 5px"}}>{row.activity_focus||""}</div></td>
                        <td style={{padding:"4px 5px",borderBottom:"1px solid #E8F5EE"}}><textarea className="ta-screen" rows={2} value={row.conditions||""} readOnly={am} onChange={e=>updLog(row.id,"conditions",e.target.value)} placeholder="Weather, water level, group…" style={{width:"100%",fontSize:11,border:"1px solid #D4D4CC",borderRadius:3,padding:"3px 5px",resize:"vertical",background:am?"#F7F7F5":"#fff"}}/><div className="ta-print" style={{fontSize:11,padding:"3px 5px"}}>{row.conditions||""}</div></td>
                        <td style={{padding:"4px 5px",borderBottom:"1px solid #E8F5EE"}}><textarea className="ta-screen" rows={2} value={row.progress_notes||""} readOnly={am} onChange={e=>updLog(row.id,"progress_notes",e.target.value)} placeholder="Skills progressed…" style={{width:"100%",fontSize:11,border:"1px solid #D4D4CC",borderRadius:3,padding:"3px 5px",resize:"vertical",background:am?"#F7F7F5":"#fff"}}/><div className="ta-print" style={{fontSize:11,padding:"3px 5px"}}>{row.progress_notes||""}</div></td>
                        {!am&&<td style={{textAlign:"center",padding:"4px"}}>{(data.participation_log||[]).length>1&&<button onClick={()=>removeLog(row.id)} style={{background:"none",border:"none",color:RED,cursor:"pointer",fontSize:14}}>✕</button>}</td>}
                      </tr>
                    ))}
                  </tbody>
                  <tfoot><tr style={{background:LG}}>
                    <td colSpan={2} style={{padding:"6px 8px",fontWeight:700,color:DG,textAlign:"right",fontSize:12}}>Total:</td>
                    <td style={{padding:"6px 8px",fontWeight:800,color:parseFloat(totalHours())>=12?G:AMBER,fontSize:13}}>{totalHours()} hrs</td>
                    <td colSpan={am?3:4} style={{padding:"6px 8px",fontSize:11,color:parseFloat(totalHours())>=12?G:AMBER}}>{parseFloat(totalHours())>=12?"✓ Minimum 12 hours met":`${(12-parseFloat(totalHours())).toFixed(1)} more hours needed`}</td>
                  </tr></tfoot>
                </table>
              </div>
              {!am&&<button onClick={addLog} style={{background:LG,border:`1px solid ${G}`,color:G,borderRadius:5,padding:"5px 12px",fontSize:12,fontWeight:600,cursor:"pointer",marginTop:8}}>+ Add session</button>}
              {am&&<ACStatus id="2.1" status={acStatus("2.1")} onChange={v=>setACStatus("2.1",v)}/>}
            </div>

            {/* AC 2.2 */}
            <ACQ ac="2.2" am={am} label="Demonstrate progression of your skills during the activity.">
              <Hint text="Write a detailed account of how your skills have progressed over the 12+ hours. Use specific examples — name skills, describe what you could do at the start vs what you can do now. Reference your participation log entries."/>
              <TA value={data.ac22_progression} onChange={upd("ac22_progression")} rows={8} ph={`At the start of the unit, I could…

Over the sessions, I worked on…

By the end of the unit, I can now…

A specific example of skill progression: …`} disabled={am} recordings={data.recordings?.ac22_progression||[]} onAddRecording={updRec("ac22_progression")}/>
              <ObsRecord ac="2.1 + 2.2" title="Participation in the activity (min. 12 hours) and demonstration of skill progression." date={data.ac22_obs_date} assessor={data.ac22_obs_assessor} notes={data.ac22_obs_notes} pass={data.ac22_obs_pass===true?true:data.ac22_obs_pass===false?false:null} onDate={v=>update({ac22_obs_date:v})} onAssessor={v=>update({ac22_obs_assessor:v})} onNotes={v=>update({ac22_obs_notes:v})} onPass={v=>update({ac22_obs_pass:v})} am={am}/>
              {am&&<ACStatus id="2.2" status={acStatus("2.2")} onChange={v=>setACStatus("2.2",v)}/>}
            </ACQ>

            <ResearchLinks items={[
              ["Outdoor Partnership — Skills Progression","https://www.outdoorpartnership.co.uk","Pathways for developing outdoor activity skills in North Wales"],
              ["NRW — Visit Wales Outdoor Activities","https://naturalresources.wales/days-out/activities","Locations and conditions guidance for outdoor activities across Wales"],
              ["Honey & Mumford — Learning Styles","https://www.businessballs.com/self-awareness/honey-and-mumford-learning-styles/","Background reading on experiential learning cycles relevant to skill progression"],
            ]}/>
            <AssessorFeedback label="LO 2" value={loFb("lo2")} onChange={v=>setLOFeedback("lo2",v)} assessorMode={am}/>
            {!am&&<ContinueBtn label="Continue to LO 3 →" onClick={()=>setSec("lo3")}/>}
          </div>
        )}

        {/* LO 3 */}
        {(sec==="lo3"||(printing&&printMode!=="section"))&&(
          <div className="wb-section">
            <LOHeader num={3} title="Be Able to Review Personal Goals During Activity Participation"/>
            <KB title="Evaluating Your Progress — What Does Good Look Like?" items={[
              "An <strong>evaluation</strong> at Level 3 goes beyond description. You should not just say what happened — you should analyse whether you are where you expected to be, explain why or why not, and judge the quality of your progress.",
              "Use evidence from your participation log: specific sessions, conditions, outcomes.",
              "Consider both technical and tactical skill development, not just physical improvement.",
              "Where you fell short of a goal: analyse WHY — was the goal unrealistic? Were there conditions or circumstances that prevented progress? What would you do differently?",
            ]}/>
            <KB title="Setting New Goals for Future Progression" items={[
              "New goals should logically follow from your evaluation — if you achieved a goal, the new goal should extend it to the next level.",
              "If you did not fully achieve a goal, decide whether to carry it forward with adjustments, or replace it with a more suitable goal.",
              "Long-term goals may need to be revised based on what you have learned about your learning rate and the activity.",
              "Consider: NGB qualifications, leadership aspirations, specific technical milestones, or breadth — developing skills in a related activity.",
            ]}/>
            <div style={{height:2,background:LG,borderRadius:2,margin:"22px 0"}}/>
            <div style={{background:DG,color:"#fff",borderRadius:6,padding:"8px 14px",fontSize:12,fontWeight:700,marginBottom:16,letterSpacing:".05em",textTransform:"uppercase"}}>Assessment Tasks — LO 3</div>
            <ACQ ac="3.1" am={am} label="Evaluate your personal progress while participating in the outdoor learning activity.">
              <Hint text="Evaluate (not just describe) — this means making judgements about the quality of your progress and explaining why. Use specific examples from your sessions. Did you meet your goals from LO 1? Why/why not?"/>
              <TA value={data.ac31_evaluation} onChange={upd("ac31_evaluation")} rows={8} ph={`Overall evaluation of my progress: …

Short-term goal 1 review: Did I achieve it? Evidence: …

Short-term goal 2 review: Did I achieve it? Evidence: …

Factors that helped/hindered progress: …

Most significant skills developed: …`} disabled={am} recordings={data.recordings?.ac31_evaluation||[]} onAddRecording={updRec("ac31_evaluation")}/>
              {am&&<ACStatus id="3.1" status={acStatus("3.1")} onChange={v=>setACStatus("3.1",v)}/>}
            </ACQ>
            <ACQ ac="3.2" am={am} label="Review your personal goals from AC 1.2 and set new goals for future progression.">
              <Hint text="First, explicitly review each goal from LO 1 — met/not met and why. Then set new, specific goals for the future. New goals should build logically on what you have achieved or learned."/>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
                <div>
                  <div style={{fontSize:12,fontWeight:600,color:G,marginBottom:4,padding:"6px 8px",background:LG,borderRadius:5}}>Review of goals from AC 1.2</div>
                  <TA value={data.ac32_goal_review} onChange={upd("ac32_goal_review")} rows={7} ph={`Short-term goal 1 [state the original goal]: Met / Partially met / Not met
Evidence: …
Reason if not fully met: …

Long-term goal 1: Progress made so far: …`} disabled={am} recordings={data.recordings?.ac32_goal_review||[]} onAddRecording={updRec("ac32_goal_review")}/>
                </div>
                <div>
                  <div style={{fontSize:12,fontWeight:600,color:DG,marginBottom:4,padding:"6px 8px",background:LG,borderRadius:5}}>New goals for future progression</div>
                  <TA value={data.ac32_new_goals} onChange={upd("ac32_new_goals")} rows={7} ph={`New short-term goal: …
How I will work towards it: …
Timeline: …

New long-term goal: …
Why I have set this goal: …`} disabled={am} recordings={data.recordings?.ac32_new_goals||[]} onAddRecording={updRec("ac32_new_goals")}/>
                </div>
              </div>
              {am&&<ACStatus id="3.2" status={acStatus("3.2")} onChange={v=>setACStatus("3.2",v)}/>}
            </ACQ>
            <ResearchLinks items={[
              ["Agored Cymru — Goal Setting Resources","https://agored.cymru","Guidance on setting and reviewing personal development goals at Level 3"],
              ["Mind Tools — SMART Goals","https://www.mindtools.com/a4wo118/smart-goals","Background reading on writing specific, measurable goals"],
              ["UK Coaching — Reflective Practice","https://www.ukcoaching.org/resources/topics/guides/a-brief-guide-to-reflective-practice","Guidance on reflective evaluation of personal performance and progress"],
            ]}/>
            <AssessorFeedback label="LO 3" value={loFb("lo3")} onChange={v=>setLOFeedback("lo3",v)} assessorMode={am}/>
            {!am&&<ContinueBtn label="Continue to LO 4 →" onClick={()=>setSec("lo4")}/>}
          </div>
        )}

        {/* LO 4 */}
        {(sec==="lo4"||(printing&&printMode!=="section"))&&(
          <div className="wb-section">
            <LOHeader num={4} title="Understand How Outdoor Learning Has Contributed to Further Development of Own Skills"/>
            <KBTable title="Employability Skills Developed Through Outdoor Activities" headers={["Skill","What it means","How outdoor activities develop it"]} rows={[
              ["Communication","Conveying information clearly; active listening","Briefing your team before a rapid; giving feedback on navigation; calling hazards"],
              ["Teamwork","Working effectively with others toward a shared goal","Group expeditions; buddy systems; shared risk management responsibility"],
              ["Leadership","Taking initiative; guiding and motivating others","Leading sections of a route; making dynamic risk decisions; managing group welfare"],
              ["Problem-solving","Identifying issues and generating effective solutions","Route finding under pressure; equipment failure management; weather decisions"],
              ["Resilience","Persevering through difficulty; recovering from setbacks","Pushing through challenging terrain; dealing with capsizes; adapting to adverse weather"],
              ["Self-management","Planning, organising and taking responsibility","Preparing kit; managing nutrition/hydration; self-assessment of skill level vs risk"],
              ["Risk management","Identifying, assessing and managing hazards","Applying RA skills in dynamic real-world conditions with genuine consequences"],
            ]}/>
            <KB title="Enjoyment, Challenge and Independence in Outdoor Learning" items={[
              "<strong>Enjoyment</strong> in outdoor activities often comes from achieving something meaningful in a natural environment — the intrinsic reward of a successful river descent, summit, or technical climb.",
              "<strong>Challenge</strong> is a key feature of outdoor education: physical challenge (endurance, strength, technique), cognitive challenge (navigation, decision-making under pressure) and emotional challenge (managing fear, uncertainty, group dynamics).",
              "<strong>Independence</strong> — outdoor activities progressively build autonomy. A Level 3 learner should be moving from reliance on an instructor toward self-directed participation, where you make your own decisions and take responsibility for outcomes.",
            ]}/>
            <div style={{height:2,background:LG,borderRadius:2,margin:"22px 0"}}/>
            <div style={{background:DG,color:"#fff",borderRadius:6,padding:"8px 14px",fontSize:12,fontWeight:700,marginBottom:16,letterSpacing:".05em",textTransform:"uppercase"}}>Assessment Tasks — LO 4</div>
            <ACQ ac="4.1" am={am} label="Explain how participating in this outdoor learning activity has developed your employability skills.">
              <Hint text="Name specific employability skills from the table above. For each, explain HOW the activity specifically developed that skill — use examples from your sessions. At Level 3, 'I improved my teamwork' is not enough; explain what happened and why it developed the skill."/>
              <TA value={data.ac41_employability} onChange={upd("ac41_employability")} rows={9} ph={`Employability skill 1 — [Name]:
How the activity developed it: …
Specific example from a session: …

Employability skill 2 — [Name]:
How the activity developed it: …
Specific example: …

Employability skill 3 — [Name]:
How the activity developed it: …`} disabled={am} recordings={data.recordings?.ac41_employability||[]} onAddRecording={updRec("ac41_employability")}/>
              {am&&<ACStatus id="4.1" status={acStatus("4.1")} onChange={v=>setACStatus("4.1",v)}/>}
            </ACQ>
            <ACQ ac="4.2" am={am} label="Evaluate how participating in this outdoor learning activity related to aspects of enjoyment, challenge and independence.">
              <Hint text="This is an evaluation — not just a description. For each aspect, judge the quality of the experience and explain WHY it was enjoyable, challenging or independence-building. Use specific examples."/>
              <div style={{display:"flex",flexDirection:"column",gap:10}}>
                <div><div style={{fontSize:12,fontWeight:600,color:G,marginBottom:4,padding:"6px 8px",background:LG,borderRadius:5}}>Aspects of enjoyment</div>
                <TA value={data.ac42_enjoyment} onChange={upd("ac42_enjoyment")} rows={4} ph="What aspects of the activity did you enjoy? WHY were they enjoyable? How did enjoyment change as your skills developed?…" disabled={am} recordings={data.recordings?.ac42_enjoyment||[]} onAddRecording={updRec("ac42_enjoyment")}/></div>
                <div><div style={{fontSize:12,fontWeight:600,color:"#7c3aed",marginBottom:4,padding:"6px 8px",background:"#f5f3ff",borderRadius:5,border:"1px solid #7c3aed"}}>Aspects of challenge</div>
                <TA value={data.ac42_challenge} onChange={upd("ac42_challenge")} rows={4} ph="What challenges did you face? Were they physical, cognitive or emotional? How did you respond? What did overcoming challenges feel like and what did it teach you?…" disabled={am} recordings={data.recordings?.ac42_challenge||[]} onAddRecording={updRec("ac42_challenge")}/></div>
                <div><div style={{fontSize:12,fontWeight:600,color:BLUE,marginBottom:4,padding:"6px 8px",background:BLUE_LT,borderRadius:5,border:`1px solid ${BLUE}`}}>Aspects of independence</div>
                <TA value={data.ac42_independence} onChange={upd("ac42_independence")} rows={4} ph="How did participating develop your independence? In what ways were you working more independently by the end than at the start? Give specific examples of independent decision-making or self-direction…" disabled={am} recordings={data.recordings?.ac42_independence||[]} onAddRecording={updRec("ac42_independence")}/></div>
              </div>
              {am&&<ACStatus id="4.2" status={acStatus("4.2")} onChange={v=>setACStatus("4.2",v)}/>}
            </ACQ>

            {am&&(<div style={{background:ASSESSOR_LT,border:`1.5px solid ${ASSESSOR_BD}`,borderRadius:8,padding:"16px 18px",marginTop:16}}><div style={{fontWeight:700,color:ASSESSOR_BG,fontSize:14,marginBottom:10,textTransform:"uppercase",letterSpacing:".05em"}}>Overall Result</div><div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:10}}>{["DISTINCTION","MERIT","PASS","REFER","PENDING"].map(v=>(<button key={v} onClick={()=>update({overall_result:v})} style={{padding:"6px 14px",border:`2px solid ${data.overall_result===v?(resultColour[v]||MG):BD}`,borderRadius:20,fontSize:12,fontWeight:700,cursor:"pointer",background:data.overall_result===v?"#f0f9ff":"#fff",color:data.overall_result===v?(resultColour[v]||MG):MG}}>{v}</button>))}</div><div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}><Inp label="Assessor signature" value={data.assessorSig} onChange={upd("assessorSig")} ph="Assessor name"/><Inp label="Date marked" value={data.markedDate} onChange={upd("markedDate")} type="date"/></div></div>)}
            <ResearchLinks items={[
              ["NCFE/CIPD — Employability Skills Framework","https://www.cipd.org/uk/knowledge/factsheets/employability-factsheet/","Overview of employability skills valued by employers"],
              ["Institute for Outdoor Learning — Impact of Outdoor Learning","https://www.outdoor-learning.org/research","Research on how outdoor learning develops transferable skills"],
              ["Brathay Trust — Outdoor Learning and Resilience","https://www.brathay.org.uk","Evidence on how challenge-based outdoor activities build resilience and independence"],
            ]}/>
            <AssessorFeedback label="LO 4" value={loFb("lo4")} onChange={v=>setLOFeedback("lo4",v)} assessorMode={am}/>
            {!am&&<ContinueBtn label="Continue to Evidence →" onClick={()=>setSec("evidence")}/>}
          </div>
        )}

        {/* EVIDENCE */}
        {(sec==="evidence"||(printing&&printMode!=="section"))&&(
          <div className="wb-section">
            <h2 style={{color:G,fontWeight:700,fontSize:20,marginBottom:6,borderBottom:`2px solid ${G}`,paddingBottom:8}}>Photo &amp; Audio Evidence</h2>
            <p style={{fontSize:13,color:MG,marginBottom:16}}>Upload photos and audio from your activity sessions, skills progression evidence, or any other supporting materials.</p>
            <EvidenceSection data={data} update={update} am={am}/>
            {!am&&<ContinueBtn label="Continue to Checklist →" onClick={()=>setSec("checklist")}/>}
          </div>
        )}

        {/* CHECKLIST */}
        {(sec==="checklist"||(printing&&printMode!=="section"))&&(
          <div className="wb-section">
            <h2 style={{color:G,fontWeight:700,fontSize:20,marginBottom:16,borderBottom:`2px solid ${G}`,paddingBottom:8}}>Assessment Checklist &amp; Declaration</h2>
            {EV_LOS.map(lo=>(<div key={lo.id} style={{marginBottom:14,background:"#fff",borderRadius:8,border:`1.5px solid ${BD}`,padding:"12px 16px"}}><div style={{fontWeight:700,fontSize:14,color:G,marginBottom:8}}>{lo.title}</div>{lo.acs.map(ac=>{const checked=!!(data.checklist||{})[ac];return(<label key={ac} style={{display:"flex",alignItems:"center",gap:8,marginBottom:6,cursor:am?"default":"pointer",fontSize:13}}><input type="checkbox" checked={checked} disabled={am} onChange={e=>update({checklist:{...(data.checklist||{}),[ac]:e.target.checked}})} style={{accentColor:G,width:15,height:15}}/><span style={{color:checked?G:"#1a1a1a"}}>AC {ac} — {checked?"Complete ✓":"Not yet completed"}</span></label>);})}</div>))}
            <div style={{background:"#fff",border:`1.5px solid ${BD}`,borderRadius:8,padding:"16px 18px",marginTop:16}}><div style={{fontWeight:700,fontSize:14,color:G,marginBottom:10}}>Student Declaration</div><p style={{fontSize:13,color:"#333",marginBottom:12,lineHeight:1.6}}>I confirm that the work submitted is my own and that I have referenced all sources used.</p><div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}><Inp label="Student signature" value={data.studentSig} onChange={upd("studentSig")} ph="Type your full name to sign" disabled={am}/><Inp label="Date" value={data.declarationDate} onChange={upd("declarationDate")} type="date" disabled={am}/></div></div>
          </div>
        )}

        {/* GLOSSARY */}
        {(sec==="glossary"||(printing&&printMode!=="section"))&&(
          <div className="wb-section">
            <h2 style={{color:G,fontWeight:700,fontSize:20,marginBottom:16,borderBottom:`2px solid ${G}`,paddingBottom:8}}>Glossary</h2>
            <table className="data-tbl"><thead><tr><th style={{width:"28%"}}>Term</th><th>Definition</th></tr></thead><tbody>
              {[["Outdoor learning activity","A structured activity in the natural environment that provides specific opportunities for skill, knowledge or personal development."],["Skill progression","Observable improvement in the quality, consistency or range of application of a specific skill over time."],["SMART goals","Goals that are Specific, Measurable, Achievable, Relevant and Time-bound."],["Short-term goal","A goal achievable within the duration of the unit (12 hours of participation)."],["Long-term goal","A goal that extends beyond this unit — may take months or years to achieve."],["Employability skills","Transferable skills valued by employers — communication, teamwork, leadership, problem-solving, resilience, self-management."],["Kolb's Learning Cycle","A model of experiential learning: Concrete Experience → Reflective Observation → Abstract Conceptualisation → Active Experimentation."],["Conscious Competence Model","A model describing four stages of skill acquisition: unconscious incompetence → conscious incompetence → conscious competence → unconscious competence."],["Rationale","A reasoned account of why a particular choice has been made — not just what was chosen."],["Evaluate","To make a judgement about the quality, effectiveness or value of something, supported by evidence — more than just describing what happened."],["Technical skill","The physical execution of a specific movement or technique (e.g. paddling stroke, climbing footwork)."],["Tactical skill","Decision-making and judgment in the activity context (e.g. choosing a line, reading terrain, managing group welfare)."],["Resilience","The ability to persist through difficulty, recover from setbacks, and adapt to challenging circumstances."],["Independence","The capacity to direct one's own learning and activity participation with decreasing reliance on external guidance."],["Participation log","A record of each session of the activity, including date, duration, location, focus and progress notes."]].map(([t,d],i)=>(<tr key={i}><td style={{fontWeight:600,fontSize:13,color:G}}>{t}</td><td style={{fontSize:13,lineHeight:1.55}}>{d}</td></tr>))}
            </tbody></table>
          </div>
        )}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
